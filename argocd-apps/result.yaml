apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: result
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mochthebest-byte/gitops.git
    targetRevision: HEAD
    path: apps/result
  destination:
    server: https://kubernetes.default.svc
    namespace: voting-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
