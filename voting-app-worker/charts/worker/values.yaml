replicaCount: 1

image:
  repository: 657954628960.dkr.ecr.eu-central-1.amazonaws.com/my-app/worker
  tag: latest
  pullPolicy: IfNotPresent

postgresql:
  host: postgresql
  port: 5432
  database: db
  user: vote_user
  existingSecret: postgresql
  secretPasswordKey: password

resources:
  requests:
    memory: 256Mi
    cpu: 200m
  limits:
    memory: 512Mi
    cpu: 1000m

redis:
  host: redis-master
  port: 6379
