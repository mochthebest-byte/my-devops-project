replicaCount: 1

global:
  # ══════════════════════════════════════════════════════════
  #  AWS — перевизначається per-environment (ArgoCD helm.values)
  # ══════════════════════════════════════════════════════════
  awsAccountId: "AWS_ACCOUNT_ID"   # ⚠️ Замінити на ID вашого AWS акаунта
  awsRegion: "eu-central-1"

image:
  repository: my-app/worker            # Тільки ім'я репо (full URL збирається в шаблоні)
  tag: stable                          # Overridden by CI via GitOps
  pullPolicy: IfNotPresent

postgresql:
  host: postgresql
  port: 5432
  database: db
  user: vote_user
  existingSecret: postgresql
  secretPasswordKey: password

resources:
  requests:
    memory: 256Mi
    cpu: 200m
  limits:
    memory: 512Mi
    cpu: 1000m

redis:
  host: redis-master
  port: 6379
