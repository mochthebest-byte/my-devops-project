replicaCount: 1

global:
  awsAccountId: "AWS_ACCOUNT_ID"
  awsRegion: "eu-central-1"

image:
  repository: my-app/worker
  digest: sha256:0898ee718c5d264f82a43acad7a2103308a1b16360b74364fbb64f6019482aa1
  tag: ""
  pullPolicy: IfNotPresent

serviceAccount:
  create: false
  name: ""
  annotations: {}

pdb:
  create: true
  minAvailable: 1

scaledObject:
  create: true
  minReplicas: 1
  maxReplicas: 5
  triggers:
    - type: cpu
      metadata:
        type: Utilization
        value: "70"
    - type: memory
      metadata:
        type: Utilization
        value: "80"

networkPolicy:
  create: true

postgresql:
  host: postgresql
  port: 5432
  database: db
  user: vote_user
  existingSecret: postgresql
  secretPasswordKey: password

probes:
  readinessPath: /
  livenessPath: /
  readinessDelay: 5
  livenessDelay: 15
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

resources:
  requests:
    memory: 256Mi
    cpu: 200m
  limits:
    memory: 512Mi
    cpu: 1000m

redis:
  host: redis-master
  port: 6379
