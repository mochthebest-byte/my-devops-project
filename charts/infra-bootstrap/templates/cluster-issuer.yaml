{{- if .Values.global.enabled }}
{{- if .Values.clusterIssuer.enabled }}
# ═══════════════════════════════════════════════════════════════
#  cert-manager ClusterIssuers
# ═══════════════════════════════════════════════════════════════
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: {{ .Values.clusterIssuer.email }}
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: {{ .Values.clusterIssuer.gateway.name }}
                namespace: {{ .Values.clusterIssuer.gateway.namespace }}
                kind: Gateway
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: {{ .Values.clusterIssuer.email }}
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: {{ .Values.clusterIssuer.gateway.name }}
                namespace: {{ .Values.clusterIssuer.gateway.namespace }}
                kind: Gateway
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-issuer
spec:
  selfSigned: {}
{{- end }}

{{- if .Values.certificates.enabled }}
# ═══════════════════════════════════════════════════════════════
#  Сертифікати
# ═══════════════════════════════════════════════════════════════
{{- if .Values.certificates.selfSigned.enabled }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.certificates.selfSigned.secretName }}
  namespace: voting-app
spec:
  secretName: {{ .Values.certificates.selfSigned.secretName }}
  commonName: {{ .Values.certificates.selfSigned.commonName | quote }}
  dnsNames:
  {{- range .Values.certificates.selfSigned.dnsNames }}
    - {{ . | quote }}
  {{- end }}
  issuerRef:
    name: {{ .Values.certificates.selfSigned.issuerName }}
    kind: ClusterIssuer
{{- end }}
{{- if .Values.certificates.letsEncryptStaging.enabled }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.certificates.letsEncryptStaging.secretName }}
  namespace: voting-app
spec:
  secretName: {{ .Values.certificates.letsEncryptStaging.secretName }}
  commonName: {{ .Values.certificates.letsEncryptStaging.commonName | quote }}
  dnsNames:
  {{- range .Values.certificates.letsEncryptStaging.dnsNames }}
    - {{ . | quote }}
  {{- end }}
  issuerRef:
    name: {{ .Values.certificates.letsEncryptStaging.issuerName }}
    kind: ClusterIssuer
{{- end }}
{{- end }}
{{- end }}
