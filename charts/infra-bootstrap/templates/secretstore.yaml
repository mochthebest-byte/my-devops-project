{{- if and .Values.global.enabled .Values.secretStore.enabled }}
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.secretStore.aws.region }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ .Values.secretStore.aws.serviceAccount.name }}
            namespace: {{ .Values.secretStore.aws.serviceAccount.namespace }}
{{- end }}
