{{- if and .Values.global.enabled .Values.externalSecrets.enabled }}
{{- if .Values.externalSecrets.grafanaOidc.enabled }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-oidc
  namespace: {{ .Values.externalSecrets.grafanaOidc.namespace }}
spec:
  refreshInterval: {{ .Values.externalSecrets.grafanaOidc.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.grafanaOidc.secretStore.name }}
    kind: {{ .Values.externalSecrets.grafanaOidc.secretStore.kind }}
  target:
    name: {{ .Values.externalSecrets.grafanaOidc.target.name }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: client-secret
      remoteRef:
        key: {{ .Values.externalSecrets.grafanaOidc.remoteRef.key }}
        property: {{ .Values.externalSecrets.grafanaOidc.remoteRef.property }}
{{- end }}

{{- if .Values.externalSecrets.postgresql.enabled }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgresql
  namespace: {{ .Values.externalSecrets.postgresql.namespace }}
spec:
  refreshInterval: {{ .Values.externalSecrets.postgresql.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.postgresql.secretStore.name }}
    kind: {{ .Values.externalSecrets.postgresql.secretStore.kind }}
  target:
    name: {{ .Values.externalSecrets.postgresql.target.name }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.externalSecrets.postgresql.remoteRef.key }}
        property: password
    - secretKey: postgres-password
      remoteRef:
        key: {{ .Values.externalSecrets.postgresql.remoteRef.key }}
        property: postgres-password
{{- end }}

