apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: vote-success-rate
  namespace: voting-app
spec:
  args:
    - name: canary-hash
  metrics:
    - name: success-rate
      initialDelay: 10s
      successCondition: result >= 0.9
      failureLimit: 3
      provider:
        prometheus:
          address: http://monitoring-kube-prometheus.monitoring:9090
          query: |
            sum(rate(nginx_ingress_controller_requests{host="vote.mochthebest.pp.ua",status=~"2[0-9]{2}"}[2m])) /
            sum(rate(nginx_ingress_controller_requests{host="vote.mochthebest.pp.ua"}[2m]))
