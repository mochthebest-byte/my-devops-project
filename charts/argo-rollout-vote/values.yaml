replicaCount: 2
global:
  awsAccountId: "AWS_ACCOUNT_ID"
  awsRegion: "eu-central-1"
image:
  repository: my-app/vote
  digest: sha256:0e0118f594e5d348b7296cb268bdf9a4e3c72277e8bc333a0b6b50ccec297b48
  tag: ""
  pullPolicy: IfNotPresent

serviceAccount:
  create: false
  name: ""
  annotations: {}

postgresql:
  host: pg-vote-rw
  port: 5432
  database: app
  # ─── Dynamic credentials from VSO (VaultDatabaseSecret) ─────
  existingSecret: pg-vote-dynamic
  secretUsernameKey: username
  secretPasswordKey: password

rabbitmq:
  host: rabbitmq
  port: 5672
  user: voting-app
  existingSecret: rabbitmq-default-user
  secretUsernameKey: username
  secretPasswordKey: password

service:
  targetPort: 80

probes:
  readinessPath: /
  livenessPath: /
  readinessDelay: 5
  livenessDelay: 15
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

canary:
  steps:
    - setWeight: 20
    - pause: {duration: 30}
    - setWeight: 50
    - pause: {duration: 30}
    - setWeight: 80
    - pause: {duration: 15}
