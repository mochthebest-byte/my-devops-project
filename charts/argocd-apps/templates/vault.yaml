apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://helm.releases.hashicorp.com
    targetRevision: 0.33.x
    chart: vault
    helm:
      values: |
        global:
          enabled: true
        server:
          # ─── HA Raft (Integrated Storage) ────────────────────────────
          ha:
            enabled: true
            replicas: 1
            raft:
              enabled: true
              setNodeSealedLabel: false
              # ─── Chart auto-generates raft config (retry_join, storage, node_id)
              #     based on replicas — no custom config needed
          # ─── Persistent storage for Raft ──────────────────────────────
          dataStorage:
            enabled: true
            size: 10Gi
            accessMode: ReadWriteOnce
            storageClass: ~
          # ─── Service ───────────────────────────────────────────────────
          service:
            enabled: true
            type: ClusterIP
            port: 8200
            clusterPort: 8201
        injector:
          enabled: false
        ui:
          enabled: true
        resources:
          requests:
            memory: 256Mi
            cpu: 100m
          limits:
            memory: 1Gi
            cpu: 500m
  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
