apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak-postgresql
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    targetRevision: 16.x
    chart: postgresql
    helm:
      values: |
        image:
          tag: latest
        auth:
          database: keycloak
          username: keycloak
          existingSecret: keycloak-db  # створюється ESO з AWS Secrets Manager /my-app/postgresql
        primary:
          service:
            type: ClusterIP
          persistence:
            storageClass: gp3
            size: 5Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
