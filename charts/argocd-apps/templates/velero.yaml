apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://vmware-tanzu.github.io/helm-charts
    targetRevision: 12.1.x
    chart: velero
    helm:
      values: |
        serviceAccount:
          server:
            create: true
            name: velero
            annotations:
              eks.amazonaws.com/role-arn: "arn:aws:iam::{{ .Values.global.awsAccountId }}:role/voting-app-velero"
        credentials:
          useSecret: false
          existingSecret: null
        initContainers:
          - name: velero-plugin-for-aws
            image: velero/velero-plugin-for-aws:v1.13.1
            imagePullPolicy: IfNotPresent
            volumeMounts:
              - mountPath: /target
                name: plugins
        configuration:
          backupStorageLocation:
            - name: default
              provider: aws
              bucket: voting-app-velero-backups-{{ .Values.global.awsAccountId }}
              config:
                region: eu-central-1
          volumeSnapshotLocation:
            - name: default
              provider: aws
              config:
                region: eu-central-1
        schedules:
          daily:
            disabled: false
            schedule: "0 2 * * *"
            template:
              ttl: "720h"
              includedNamespaces:
                - voting-app
                - keycloak
                - monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
