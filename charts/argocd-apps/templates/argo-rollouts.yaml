apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-rollouts
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    targetRevision: 2.41.x
    chart: argo-rollouts
    helm:
      values: |
        controller:
          metrics:
            enabled: false
        dashboard:
          enabled: true
          ingress:
            enabled: true
            ingressClassName: ""
            hosts:
              - rollouts.mochthebest.pp.ua
            annotations:
              external-dns.alpha.kubernetes.io/hostname: "rollouts.mochthebest.pp.ua"
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-rollouts
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
