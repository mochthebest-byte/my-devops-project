apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgresql
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    targetRevision: 18.7.x
    chart: postgresql
    helm:
      values: |
        image:
          tag: latest
        auth:
          database: db
          username: vote_user
          existingSecret: postgresql
        primary:
          service:
            type: ClusterIP
          persistence:
            storageClass: gp3
            size: 8Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: voting-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
