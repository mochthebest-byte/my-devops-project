apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vso-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"     # After VSO is running
spec:
  project: default
  source:
    repoURL: https://github.com/mochthebest-byte/my-devops-project.git
    targetRevision: HEAD
    path: charts/vso-config
  destination:
    server: https://kubernetes.default.svc
    namespace: vault-secrets-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
