apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"    # Before everything else
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    targetRevision: ~> 1.20
    chart: cert-manager
    helm:
      values: |
        installCRDs: true
        extraObjects:
          - apiVersion: cert-manager.io/v1
            kind: ClusterIssuer
            metadata:
              name: keycloak-selfsigned
            spec:
              selfSigned: {}
          - apiVersion: cert-manager.io/v1
            kind: ClusterIssuer
            metadata:
              name: letsencrypt-prod
            spec:
              acme:
                server: https://acme-v02.api.letsencrypt.org/directory
                email: admin@mochthebest.pp.ua
                privateKeySecretRef:
                  name: letsencrypt-prod-account-key
                solvers:
                  - dns01:
                      route53:
                        region: eu-central-1
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
      - Replace=true
