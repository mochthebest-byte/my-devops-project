apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-rollout-vote
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/mochthebest-byte/my-devops-project.git
    targetRevision: HEAD
    path: charts/argo-rollout-vote
    helm:
      values: |
        global:
          awsAccountId: {{ .Values.global.awsAccountId | quote }}
          awsRegion: {{ .Values.global.awsRegion | quote }}
          releaseNameOverride: "voting-app"
  destination:
    server: https://kubernetes.default.svc
    namespace: voting-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
