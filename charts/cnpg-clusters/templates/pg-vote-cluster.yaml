{{- if .Values.pgVote.enabled }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.pgVote.clusterName }}
  namespace: {{ .Values.pgVote.namespace }}
spec:
  instances: {{ .Values.pgVote.instances }}
  imageName: ghcr.io/cloudnative-pg/postgresql:18

  # External source: existing Bitnami PostgreSQL
  externalClusters:
    - name: bitnami
      connectionParameters:
        host: {{ .Values.pgVote.importSource.host }}
        port: "{{ .Values.pgVote.importSource.port }}"
        user: {{ .Values.pgVote.importSource.user }}
        dbname: {{ .Values.pgVote.database }}
      password:
        name: {{ .Values.pgVote.importSource.existingSecret }}
        key: {{ .Values.pgVote.importSource.secretKey }}

  # Import existing data from Bitnami PostgreSQL
  bootstrap:
    initdb:
      database: {{ .Values.pgVote.database }}
      owner: {{ .Values.pgVote.appUser }}
      import:
        type: microservice
        databases:
          - {{ .Values.pgVote.database }}
        source:
          externalCluster: bitnami

  storage:
    size: {{ .Values.pgVote.storageSize }}
    storageClass: {{ .Values.pgVote.storageClass }}

  # S3 backup via barman-cloud (same bucket as Velero, cnpg/ prefix)
  backup:
    barmanObjectStore:
      destinationPath: "s3://{{ include "cnpg-clusters.backup-bucket" . }}/cnpg/{{ .Values.pgVote.clusterName }}"
      s3Credentials:
        inheritFromIAMRole: true
      wal:
        compression: gzip
        maxParallel: 8
    retentionPolicy: "30d"

  # Note: ScheduledBackup is managed as a separate CR in templates/scheduled-backups.yaml
  # Note: Post-import ownership (GRANTs/ALTERs) is handled by bootstrap.initdb.owner

  # Spread across AZs for HA
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway

  # Monitoring
  monitoring:
    enablePodMonitor: true
{{- end }}
