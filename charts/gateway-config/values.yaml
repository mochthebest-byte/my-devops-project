# ═══════════════════════════════════════════════════════════════
#  Gateway Config — values
# ═══════════════════════════════════════════════════════════════

# ─── Master switch ──────────────────────────────────────
enabled: true

# ─── Domain ──────────────────────────────────────────────
domain: mochthebest.pp.ua

# ─── TLS ─────────────────────────────────────────────────
# TLS-сертифікат для HTTPS
# ⚠️  Gateway API AWS не читає certificateRefs — використовує
#      certificate discovery. Потрібен ACM ARN.
tls:
  # Увімкнути HTTPS listener (certificate discovery через AWS ACM)
  enabled: true
  # k8s Secret — не працює з AWS Gateway API
  secretName: ""
  # ACM ARN — для Ingress-аннотації (не для Gateway API)
  certificateArn: "arn:aws:acm:eu-central-1:765776786215:certificate/2832556a-442a-40a7-9287-91ab5cde01fc"

# ─── Gateway ─────────────────────────────────────────────
gateway:
  name: voting-app-gateway
  namespace: voting-app
  className: aws-lb-gateway-class
  scheme: internet-facing        # internet-facing | internal
  targetType: ip                 # ip | instance

# ─── ExternalDNS ─────────────────────────────────────────
externalDNS:
  enabled: true
  # tpl-сумісний — використовує .Values.domain
  hostname: "vote.{{ .Values.domain }}, result.{{ .Values.domain }}, grafana.{{ .Values.domain }}, keycloak.{{ .Values.domain }}, argocd.{{ .Values.domain }}"

# ─── Routes — хто на якому субдомені ────────────────────
routes:
  vote:
    enabled: true
    hostnames:
      - "vote.mochthebest.pp.ua"
    namespace: voting-app
    serviceName: vote
    port: 5000

  result:
    enabled: true
    hostnames:
      - "result.mochthebest.pp.ua"
    namespace: voting-app
    serviceName: result
    port: 81

  grafana:
    enabled: true
    hostnames:
      - "grafana.mochthebest.pp.ua"
    namespace: monitoring
    serviceName: monitoring-grafana
    port: 80

  keycloak:
    enabled: true
    hostnames:
      - "keycloak.mochthebest.pp.ua"
    namespace: keycloak
    serviceName: keycloak
    port: 8080

  argocd:
    enabled: true
    hostnames:
      - "argocd.mochthebest.pp.ua"
    namespace: argocd
    serviceName: argocd-server
    port: 80

# ─── Endpoint Syncer — cross-namespace proxy (Ingress fallback) ──
# ⚠️  Потрібен тільки при Ingress-підході.
#      З Gateway API HTTPRoute створюється в namespace сервісу,
#      тому не використовується.
endpointSyncer:
  enabled: false
  name: endpoint-syncer
  serviceAccountName: endpoint-syncer
  replicas: 1
  intervalSeconds: 30
  image:
    repository: bitnami/kubectl
    tag: latest
  targets:
    - name: grafana
      namespace: monitoring
      labelSelector: app.kubernetes.io/name=grafana
      port: 3000
      forwardName: grafana-forward
    - name: keycloak
      namespace: keycloak
      labelSelector: app=keycloak
      port: 8080
      forwardName: keycloak-forward
