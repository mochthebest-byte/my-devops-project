# ═══════════════════════════════════════════════════════════════
#  Gateway Config — values
# ═══════════════════════════════════════════════════════════════

# ─── Master switch ──────────────────────────────────────
enabled: true

# ─── Global AWS ────────────────────────────────────────
# Account ID та регіон — перевизначаються per-environment
# через ArgoCD helm.values (з charts/argocd-apps/values.yaml)
global:
  awsAccountId: "AWS_ACCOUNT_ID"
  awsRegion: "eu-central-1"

# ─── Domain ──────────────────────────────────────────────
domain: mochthebest.pp.ua

# ─── TLS ─────────────────────────────────────────────────
# HTTPS listener with ACM certificate.
# Сертифікат прив'язується до ALB через
# LoadBalancerConfiguration.listenerConfigurations (C2 fix).
tls:
  enabled: true
  # Тільки ID сертифіката (повний ARN збирається в шаблоні)
  acmCertificateId: "22036369-7242-4539-8cf7-dadec0e93164"

# ─── Gateway ─────────────────────────────────────────────
gateway:
  name: voting-app-gateway
  namespace: voting-app
  className: aws-lb-gateway-class
  scheme: internet-facing        # internet-facing | internal

# ─── ExternalDNS ─────────────────────────────────────────
externalDNS:
  enabled: true
  # tpl-сумісний — використовує .Values.domain
  hostname: "vote.{{ .Values.domain }}, result.{{ .Values.domain }}, grafana.{{ .Values.domain }}, keycloak.{{ .Values.domain }}, argocd.{{ .Values.domain }}"

# ─── Routes — хто на якому субдомені ────────────────────
routes:
  vote:
    enabled: true
    sectionName: https
    hostnames:
      - "vote.mochthebest.pp.ua"
    namespace: voting-app
    serviceName: voting-app-vote
    port: 5000

  result:
    enabled: true
    sectionName: https
    hostnames:
      - "result.mochthebest.pp.ua"
    namespace: voting-app
    serviceName: result
    port: 81

  grafana:
    enabled: true
    sectionName: https
    hostnames:
      - "grafana.mochthebest.pp.ua"
    namespace: monitoring
    serviceName: monitoring-grafana
    port: 80

  keycloak:
    enabled: true
    sectionName: https
    hostnames:
      - "keycloak.mochthebest.pp.ua"
    namespace: keycloak
    serviceName: keycloak
    port: 8080

  argocd:
    enabled: true
    sectionName: https
    hostnames:
      - "argocd.mochthebest.pp.ua"
    namespace: argocd
    serviceName: argocd-server
    port: 80

