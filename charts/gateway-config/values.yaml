# ═══════════════════════════════════════════════════════════════
#  Gateway Config — values
# ═══════════════════════════════════════════════════════════════

# ─── Master switch ──────────────────────────────────────
enabled: true

# ─── Domain ──────────────────────────────────────────────
domain: mochthebest.pp.ua

# ─── TLS ─────────────────────────────────────────────────
# HTTPS listener with ACM certificate (auto-discovered by AWS LB Controller).
# Certificate ARN is passed via alb.ingress.kubernetes.io/certificate-arn annotation.
# certificateRefs with kind:Secret is only needed when using k8s TLS Secrets
# (e.g. cert-manager) — left empty here because ACM handles termination.
tls:
  enabled: true
  # k8s TLS Secret name (leave empty for ACM auto-discovery)
  secretName: ""
  # ACM ARN — прив'язка ACM сертифіката до ALB через annotation
  certificateArn: "arn:aws:acm:eu-central-1:765776786215:certificate/2832556a-442a-40a7-9287-91ab5cde01fc"

# ─── Gateway ─────────────────────────────────────────────
gateway:
  name: voting-app-gateway
  namespace: voting-app
  className: aws-lb-gateway-class
  scheme: internet-facing        # internet-facing | internal
  targetType: ip                 # ip | instance

# ─── ExternalDNS ─────────────────────────────────────────
externalDNS:
  enabled: true
  # tpl-сумісний — використовує .Values.domain
  hostname: "vote.{{ .Values.domain }}, result.{{ .Values.domain }}, grafana.{{ .Values.domain }}, keycloak.{{ .Values.domain }}, argocd.{{ .Values.domain }}"

# ─── Routes — хто на якому субдомені ────────────────────
routes:
  vote:
    enabled: true
    hostnames:
      - "vote.mochthebest.pp.ua"
    namespace: voting-app
    serviceName: voting-app-vote
    port: 5000

  result:
    enabled: true
    hostnames:
      - "result.mochthebest.pp.ua"
    namespace: voting-app
    serviceName: result
    port: 81

  grafana:
    enabled: true
    hostnames:
      - "grafana.mochthebest.pp.ua"
    namespace: monitoring
    serviceName: monitoring-grafana
    port: 80

  keycloak:
    enabled: true
    hostnames:
      - "keycloak.mochthebest.pp.ua"
    namespace: keycloak
    serviceName: keycloak
    port: 8080

  argocd:
    enabled: true
    hostnames:
      - "argocd.mochthebest.pp.ua"
    namespace: argocd
    serviceName: argocd-server
    port: 80

