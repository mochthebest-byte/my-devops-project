# ═══════════════════════════════════════════════════════════════
#  Gateway Config — values
# ═══════════════════════════════════════════════════════════════

# ─── Master switch ──────────────────────────────────────
enabled: true

# ─── Domain ──────────────────────────────────────────────
domain: mochthebest.pp.ua

# ─── TLS ─────────────────────────────────────────────────
# HTTPS listener with ACM certificate (auto-discovered by AWS LB Controller).
# Gateway API використовує certificateRefs — для ACM сертифікати
# прив'язуються до ALB через теґи (kubernetes.io/cluster/*).
# Аргумент certificateArn передається через LoadBalancerConfiguration
# при потребі явної прив'язки.
tls:
  enabled: true
  # k8s TLS Secret name (leave empty for ACM auto-discovery)
  secretName: ""
  # ACM ARN — не використовується напряму (збережено для довідки)
  certificateArn: "arn:aws:acm:eu-central-1:657954628960:certificate/TO_BE_REPLACED_AFTER_TERRAFORM_APPLY"

# ─── Gateway ─────────────────────────────────────────────
gateway:
  name: voting-app-gateway
  namespace: voting-app
  className: aws-lb-gateway-class
  scheme: internet-facing        # internet-facing | internal

# ─── ExternalDNS ─────────────────────────────────────────
externalDNS:
  enabled: true
  # tpl-сумісний — використовує .Values.domain
  hostname: "vote.{{ .Values.domain }}, result.{{ .Values.domain }}, grafana.{{ .Values.domain }}, keycloak.{{ .Values.domain }}, argocd.{{ .Values.domain }}"

# ─── Routes — хто на якому субдомені ────────────────────
routes:
  vote:
    enabled: true
    sectionName: https
    hostnames:
      - "vote.mochthebest.pp.ua"
    namespace: voting-app
    serviceName: voting-app-vote
    port: 5000

  result:
    enabled: true
    sectionName: https
    hostnames:
      - "result.mochthebest.pp.ua"
    namespace: voting-app
    serviceName: result
    port: 81

  grafana:
    enabled: true
    sectionName: https
    hostnames:
      - "grafana.mochthebest.pp.ua"
    namespace: monitoring
    serviceName: monitoring-grafana
    port: 80

  keycloak:
    enabled: true
    sectionName: https
    hostnames:
      - "keycloak.mochthebest.pp.ua"
    namespace: keycloak
    serviceName: keycloak
    port: 8080

  argocd:
    enabled: true
    sectionName: https
    hostnames:
      - "argocd.mochthebest.pp.ua"
    namespace: argocd
    serviceName: argocd-server
    port: 80

