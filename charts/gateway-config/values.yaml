# ═══════════════════════════════════════════════════════════════
#  Gateway Config — values
# ═══════════════════════════════════════════════════════════════

# ─── Master switch ──────────────────────────────────────
enabled: true

# ─── Domain ──────────────────────────────────────────────
domain: mochthebest.pp.ua

# ─── TLS ─────────────────────────────────────────────────
# TLS-сертифікат для HTTPS
# AWS ALB Gateway API auto-discovers ACM certificates matching
# listener hostnames — certificateRefs with kind:Secret is only
# needed when using k8s TLS Secrets (e.g. cert-manager).
tls:
  # Увімкнути HTTPS listener
  enabled: true
  # k8s TLS Secret name (leave empty for ACM auto-discovery)
  secretName: ""
  # ACM ARN — deprecated on Gateway API (kept for backward compat)
  certificateArn: ""

# ─── Gateway ─────────────────────────────────────────────
gateway:
  name: voting-app-gateway
  namespace: voting-app
  className: aws-lb-gateway-class
  scheme: internet-facing        # internet-facing | internal
  targetType: ip                 # ip | instance

# ─── ExternalDNS ─────────────────────────────────────────
externalDNS:
  enabled: true
  # tpl-сумісний — використовує .Values.domain
  hostname: "vote.{{ .Values.domain }}, result.{{ .Values.domain }}, grafana.{{ .Values.domain }}, keycloak.{{ .Values.domain }}, argocd.{{ .Values.domain }}"

# ─── Routes — хто на якому субдомені ────────────────────
routes:
  vote:
    enabled: true
    hostnames:
      - "vote.mochthebest.pp.ua"
    namespace: voting-app
    serviceName: voting-app-vote
    port: 5000

  result:
    enabled: true
    hostnames:
      - "result.mochthebest.pp.ua"
    namespace: voting-app
    serviceName: result
    port: 81

  grafana:
    enabled: true
    hostnames:
      - "grafana.mochthebest.pp.ua"
    namespace: monitoring
    serviceName: monitoring-grafana
    port: 80

  keycloak:
    enabled: true
    hostnames:
      - "keycloak.mochthebest.pp.ua"
    namespace: keycloak
    serviceName: keycloak
    port: 8080

  argocd:
    enabled: true
    hostnames:
      - "argocd.mochthebest.pp.ua"
    namespace: argocd
    serviceName: argocd-server
    port: 80

# ─── Endpoint Syncer — cross-namespace proxy (Ingress fallback) ──
# ⚠️  Потрібен тільки при Ingress-підході.
#      З Gateway API HTTPRoute створюється в namespace сервісу,
#      тому не використовується.
endpointSyncer:
  enabled: false
  name: endpoint-syncer
  serviceAccountName: endpoint-syncer
  replicas: 1
  intervalSeconds: 30
  image:
    repository: bitnami/kubectl
    tag: 1.31
  targets:
    - name: grafana
      namespace: monitoring
      labelSelector: app.kubernetes.io/name=grafana
      port: 3000
      forwardName: grafana-forward
    - name: keycloak
      namespace: keycloak
      labelSelector: app=keycloak
      port: 8080
      forwardName: keycloak-forward
