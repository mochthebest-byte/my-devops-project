{{- if .Values.enabled }}
# ═══════════════════════════════════════════════════════════════
#  GatewayClass — AWS ALB
# ═══════════════════════════════════════════════════════════════
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ .Values.gateway.className }}
spec:
  controllerName: gateway.k8s.aws/alb
  description: "AWS ALB — створює Application Load Balancer через Gateway API"

# ═══════════════════════════════════════════════════════════════
#  Gateway — один ALB на всі сервіси
# ═══════════════════════════════════════════════════════════════
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ .Values.gateway.namespace }}
  annotations:
    {{- if .Values.externalDNS.enabled }}
    external-dns.alpha.kubernetes.io/hostname: {{ tpl .Values.externalDNS.hostname $ }}
    {{- end }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  infrastructure:
    parametersRef:
      group: gateway.k8s.aws
      kind: LoadBalancerConfiguration
      name: {{ .Values.gateway.name }}-config
  listeners:
    # ── HTTP ────────────────────────────────────────────
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    {{- if .Values.tls.enabled }}
    # ── HTTPS ───────────────────────────────────────────
    # TLS terminated at ALB via ACM cert (C2 fix).
    # certificateRefs не потрібен — ACM прив'язаний через
    # LoadBalancerConfiguration.listenerConfigurations.
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
{{- end }}
{{- end }}
