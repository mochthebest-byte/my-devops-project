{{- if and .Values.enabled .Values.tls.enabled .Values.tls.secretName }}
# ═══════════════════════════════════════════════════════════════
#  TLS Secret — прив'язка ACM сертифіката до Gateway HTTPS
# ═══════════════════════════════════════════════════════════════
#  AWS LB Controller читає анотацію alb.ingress.kubernetes.io/certificate-arn
#  і автоматично прив'язує ACM сертифікат до ALB HTTPS listener'а.
#  Самий Secret — порожній (data: {}), бо сертифікат в ACM, не в K8s.
# ═══════════════════════════════════════════════════════════════
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.tls.secretName }}
  namespace: {{ .Values.gateway.namespace }}
  annotations:
    alb.ingress.kubernetes.io/certificate-arn: {{ .Values.tls.certificateArn }}
type: Opaque
data: {}
{{- end }}
