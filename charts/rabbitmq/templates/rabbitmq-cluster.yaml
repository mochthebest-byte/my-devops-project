apiVersion: rabbitmq.com/v1beta1
kind: RabbitmqCluster
metadata:
  name: rabbitmq
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/component: message-broker
spec:
  replicas: {{ .Values.replicaCount }}
  image: docker.io/rabbitmq@sha256:93ade3d3fcd3290243fcad5ee45bd07b77c13844c2137f08608410f08f3575d6
  resources:
    requests:
      cpu: {{ .Values.resources.requests.cpu }}
      memory: {{ .Values.resources.requests.memory }}
    limits:
      cpu: {{ .Values.resources.limits.cpu }}
      memory: {{ .Values.resources.limits.memory }}
  rabbitmq:
    additionalPlugins:
      - rabbitmq_stream
      - rabbitmq_management
      - rabbitmq_prometheus
    additionalConfig: |
      {{- .Values.additionalConfig | nindent 6 }}
  persistence:
    storage: {{ .Values.persistence.storage }}
    {{- if .Values.persistence.storageClassName }}
    storageClassName: {{ .Values.persistence.storageClassName }}
    {{- end }}
  service:
    type: ClusterIP
  {{- if .Values.tls.enabled }}
  tls:
    secretName: rabbitmq-tls
  {{- end }}
  override:
    statefulSet:
      spec:
        template:
          spec:
            containers:
              - name: rabbitmq
                startupProbe:
                  exec:
                    command:
                      - /bin/bash
                      - -c
                      - rabbitmq-diagnostics check_running 2>/dev/null && echo "running"
                  initialDelaySeconds: 5
                  periodSeconds: 5
                  timeoutSeconds: 10
                  failureThreshold: 60
                  successThreshold: 1
                readinessProbe:
                  tcpSocket:
                    port: 5672
                  initialDelaySeconds: 5
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 3
                  successThreshold: 1
