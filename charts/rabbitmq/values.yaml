# RabbitMQ Cluster (RabbitmqCluster CR)
# The operator auto-generates credentials in secret: <cluster-name>-default-user
# Keys: username, password

replicaCount: 1

resources:
  requests:
    memory: 512Mi
    cpu: 200m
  limits:
    memory: 1Gi
    cpu: 500m

persistence:
  storage: 10Gi
  storageClassName: ""

# RabbitMQ Stream retention — set per-queue in app code (x-max-age, x-max-length-bytes)
stream:
  maxAge: 24h
  maxSizeBytes: 10_000_000_000

# For local dev — set false for kind
tls:
  enabled: false

# Erlang VM tuning
# RabbitMQ config overrides for the cluster
additionalConfig: |
  default_user = voting-app
  default_pass = CHANGEME_rabbitmq
