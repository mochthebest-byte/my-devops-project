{{- if .Values.vaultAuth.enabled }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: default
  namespace: {{ .Release.Namespace }}
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: {{ .Values.vaultAuth.role }}
    serviceAccount: {{ .Values.vaultAuth.serviceAccount }}
{{- end }}
