# ═══════════════════════════════════════════════════════════════
#  vault-init — values
# ═══════════════════════════════════════════════════════════════

global:
  enabled: true

# ─── Vault connection ──────────────────────────────────────────
vault:
  address: http://vault.vault.svc.cluster.local:8200
  # Number of unseal keys to split into (shamir threshold)
  initKeyShares: 1
  initKeyThreshold: 1

# ─── Database engine — PostgreSQL (CNPG pg-vote) ──────────────
database:
  enabled: true
  # CNPG cluster details
  cnpg:
    clusterName: pg-vote
    namespace: voting-app
    secretName: pg-vote-app
    host: pg-vote-rw.voting-app.svc.cluster.local
    port: 5432
    dbName: db
  role:
    name: voting-app-dynamic
    defaultTTL: 1h
    maxTTL: 24h
    # SQL to execute when creating a new dynamic user
    creationStatements: |
      CREATE USER "{{name}}" WITH PASSWORD '{{password}}' VALID UNTIL '{{expiration}}';
      GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO "{{name}}";

# ─── Secret KV engine ──────────────────────────────────────────
kv:
  enabled: true
  path: secret

# ─── VSO auth policy ───────────────────────────────────────────
vso:
  policyName: vso-policy
  authRoleName: vault-secrets-operator
  # Which Vault paths VSO is allowed to read
  policyRules: |
    path "database/creds/voting-app-dynamic" {
      capabilities = ["read"]
    }
    path "secret/data/*" {
      capabilities = ["read", "list"]
    }

# ─── Image ──────────────────────────────────────────────────────
image:
  repository: hashicorp/vault
  tag: "1.18"
  pullPolicy: IfNotPresent

kubectlImage:
  repository: bitnami/kubectl
  tag: "1.32"
  pullPolicy: IfNotPresent

# ─── Resource limits for the Job pod ──────────────────────────
resources:
  requests:
    memory: 128Mi
    cpu: 100m
  limits:
    memory: 512Mi
    cpu: 300m

# ─── Wait settings ─────────────────────────────────────────────
wait:
  maxRetries: 30
  sleepSeconds: 10
