---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: admin@example.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: voting-app-gateway
                namespace: voting-app
                kind: Gateway
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@example.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: voting-app-gateway
                namespace: voting-app
                kind: Gateway
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-issuer
spec:
  selfSigned: {}
# ═══════════════════════════════════════════════════════
#  Сертифікати
# ═══════════════════════════════════════════════════════

# Self-signed — для *.nip.io (тестування без домену)
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: voting-app-tls
  namespace: voting-app
spec:
  secretName: voting-app-tls
  commonName: "*.nip.io"
  dnsNames:
    - "*.nip.io"
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer

# Let's Encrypt Staging — для *.mochthebest.io (тестування HTTPS)
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: voting-app-tls-le
  namespace: voting-app
spec:
  secretName: voting-app-tls-le
  commonName: "*.mochthebest.io"
  dnsNames:
    - "*.mochthebest.io"
    - "mochthebest.io"
  issuerRef:
    name: letsencrypt-staging
    kind: ClusterIssuer
