---
# ClusterIssuer - Let's Encrypt Staging
# (for testing - no rate limits)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: admin@example.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    # HTTP-01 challenge: cert-manager creates a temporary HTTPRoute
    # that maps to the validation pod. Requires Gateway API support
    # enabled in cert-manager (--feature-gates=ExperimentalGatewayAPISupport=true)
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: voting-app-gateway
                namespace: voting-app
                kind: Gateway
---
# ClusterIssuer - Let's Encrypt Production
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@example.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: voting-app-gateway
                namespace: voting-app
                kind: Gateway
---
# Certificate - mochthebest.io domains (via Let's Encrypt Production)
# Valid TLS for vote.mochthebest.io, result.mochthebest.io, etc.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mochthebest-tls
  namespace: voting-app
spec:
  secretName: mochthebest-tls
  commonName: vote.mochthebest.io
  dnsNames:
    - vote.mochthebest.io
    - result.mochthebest.io
    - grafana.mochthebest.io
    - keycloak.mochthebest.io
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
---
# Self-signed ClusterIssuer (fallback for local dev)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-issuer
spec:
  selfSigned: {}
