---
# ─────────────────────────────────────────────────────
# ClusterIssuer — Let's Encrypt Staging
# (for testing — no rate limits)
# ─────────────────────────────────────────────────────
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: admin@example.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    # HTTP-01 challenge: cert-manager creates a temporary HTTPRoute
    # that maps to the validation pod. Requires Gateway API support
    # enabled in cert-manager (--feature-gates=ExperimentalGatewayAPISupport=true)
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: voting-app-gateway
                namespace: voting-app
                kind: Gateway
---
# ─────────────────────────────────────────────────────
# ClusterIssuer — Let's Encrypt Production
# ─────────────────────────────────────────────────────
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@example.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: voting-app-gateway
                namespace: voting-app
                kind: Gateway
---
# ─────────────────────────────────────────────────────
# Certificate — nip.io domains (via Let's Encrypt staging)
# ⚠️  Для production: змінити issuerRef на letsencrypt-prod
#     та налаштувати реальний DNS з Route53
# ─────────────────────────────────────────────────────
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nipio-tls
  namespace: voting-app
spec:
  secretName: nipio-tls
  commonName: keycloak.34.194.59.190.nip.io
  dnsNames:
    - keycloak.34.194.59.190.nip.io
    - grafana.34.194.59.190.nip.io
  issuerRef:
    name: letsencrypt-staging
    kind: ClusterIssuer
---
# ─────────────────────────────────────────────────────
# Self-signed ClusterIssuer (fallback for local dev)
# ─────────────────────────────────────────────────────
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-issuer
spec:
  selfSigned: {}
