---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-route
  namespace: monitoring
spec:
  parentRefs:
    - name: voting-app-gateway
      namespace: voting-app
      sectionName: https-grafana
  hostnames:
    - grafana.mochthebest.io
  rules:
    - backendRefs:
        - name: monitoring-grafana
          port: 80
