# Local (Kind) Helm overrides for all voting-app services
# Apply with: helm upgrade --install -f values-local.yaml
#
# Differences from production (AWS):
#   - Local: service type NodePort, Ingress ingress-nginx
#   - Prod:   service type ClusterIP, Gateway API (ALB)
#   - Local: no TLS (HTTP only)
#   - Prod:   TLS via ACM (AWS Certificate Manager)
#   - Local: no External Secrets (plain secrets OK)
#   - Prod:   External Secrets Operator (AWS Secrets Manager)
#   - Local: RabbitMQ default user/pass (no ESO)
#   - Prod:   RabbitMQ credentials via ESO + RabbitmqCluster operator secret

# --- vote ---
vote:
  ingress:
    enabled: true
    host: vote.local
    className: nginx
  postgresql:
    host: pg-local-cluster-rw

  rabbitmq:
    host: rabbitmq
  service:
    type: NodePort
    port: 5000
    targetPort: 80

# --- result ---
result:
  ingress:
    enabled: true
    host: result.local
    className: nginx
  postgresql:
    host: pg-local-cluster-rw

  service:
    type: NodePort
    port: 81
    targetPort: 80

# --- worker ---
worker:
  postgresql:
    host: pg-local-cluster-rw

  rabbitmq:
    host: rabbitmq

# --- postgresql ---
# ⚠️  Паролі в plaintext — тільки для локального Kind-кластера.
#      В production (AWS) пароль постачається через ESO з AWS Secrets Manager.
postgresql:
  auth:
    postgresPassword: CHANGEME
    existingSecret: ""          # без ESO — використовуємо inline password
    password: CHANGEME
