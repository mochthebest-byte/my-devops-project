# Local (Kind) Grafana — no AWS, no OIDC, HTTP-only
prometheus:
  prometheusSpec:
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: standard
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

grafana:
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m
  persistence:
    enabled: false
  # ⚠️  DEV ONLY — admin пароль в plaintext. В production (OCI) — через ESO + OIDC.
  adminPassword: CHANGEME
  env:
    GF_SERVER_ROOT_URL: "http://grafana.nip.io"
  envValueFrom: {}

alertmanager:
  alertmanagerSpec:
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: standard
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi
