---
# GatewayClass - AWS Load Balancer Controller
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: aws-lb-gateway-class
spec:
  controllerName: gateway.k8s.aws/alb
  parametersRef:
    name: voting-app-alb-config
    namespace: kube-system
    group: gateway.k8s.aws
    kind: LoadBalancerConfiguration
  description: "AWS Load Balancer Controller - provisions ALB for Gateways"
---
# LoadBalancerConfiguration - ALB settings
apiVersion: gateway.k8s.aws/v1beta1
kind: LoadBalancerConfiguration
metadata:
  name: voting-app-alb-config
  namespace: kube-system
spec:
  scheme: internet-facing
  ipAddressType: ipv4
---
# Gateway - Internet-facing ALB
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: voting-app-gateway
  namespace: voting-app
  annotations:
    alb.ingress.k8s.aws/scheme: internet-facing
    alb.ingress.k8s.aws/target-type: ip
spec:
  gatewayClassName: aws-lb-gateway-class
  listeners:
    - name: http-vote
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: http-result
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: http-grafana
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: http-keycloak
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
---
# HTTPRoute - vote via nip.io -> voting-app-vote:5000
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vote-route
  namespace: voting-app
spec:
  parentRefs:
    - name: voting-app-gateway
      sectionName: http-vote
  rules:
    - backendRefs:
        - name: voting-app-vote
          port: 5000
---
# HTTPRoute - result via nip.io -> result:81
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: result-route
  namespace: voting-app
spec:
  parentRefs:
    - name: voting-app-gateway
      sectionName: http-result
  rules:
    - backendRefs:
        - name: result
          port: 81
---
# HTTPRoute - grafana via nip.io -> grafana:80
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-route
  namespace: monitoring
spec:
  parentRefs:
    - name: voting-app-gateway
      namespace: voting-app
      sectionName: http-grafana
  rules:
    - backendRefs:
        - name: monitoring-grafana
          port: 80
---
# HTTPRoute - keycloak via nip.io -> keycloak:8080
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak-route
  namespace: keycloak
spec:
  parentRefs:
    - name: voting-app-gateway
      namespace: voting-app
      sectionName: http-keycloak
  rules:
    - backendRefs:
        - name: keycloak
          port: 8080
