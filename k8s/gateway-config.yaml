---
# GatewayClass - AWS Load Balancer Controller
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: aws-lb-gateway-class
spec:
  controllerName: gateway.k8s.aws/alb
  parametersRef:
    name: voting-app-alb-config
    namespace: kube-system
    group: gateway.k8s.aws
    kind: LoadBalancerConfiguration
  description: "AWS Load Balancer Controller - provisions ALB for Gateways"
---
# LoadBalancerConfiguration - ALB settings
apiVersion: gateway.k8s.aws/v1beta1
kind: LoadBalancerConfiguration
metadata:
  name: voting-app-alb-config
  namespace: kube-system
spec:
  scheme: internet-facing
  ipAddressType: ipv4
---
# Gateway - Internet-facing ALB for voting-app
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: voting-app-gateway
  namespace: voting-app
  annotations:
    alb.ingress.k8s.aws/scheme: internet-facing
    alb.ingress.k8s.aws/target-type: ip
    # ExternalDNS: auto-create Route53 records
    external-dns.alpha.kubernetes.io/hostname: vote.mochthebest.io, result.mochthebest.io, grafana.mochthebest.io
spec:
  gatewayClassName: aws-lb-gateway-class
  listeners:
    - name: http-vote
      protocol: HTTP
      port: 80
      hostname: vote.mochthebest.io
      allowedRoutes:
        namespaces:
          from: Same
    - name: http-result
      protocol: HTTP
      port: 80
      hostname: result.mochthebest.io
      allowedRoutes:
        namespaces:
          from: Same
    - name: https-grafana
      protocol: HTTPS
      port: 443
      hostname: grafana.mochthebest.io
      tls:
        mode: Terminate
        certificateRefs:
          - name: mochthebest-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: https-keycloak
      protocol: HTTPS
      port: 443
      hostname: keycloak.mochthebest.io
      tls:
        mode: Terminate
        certificateRefs:
          - name: mochthebest-tls
      allowedRoutes:
        namespaces:
          from: All
---
# HTTPRoute - vote.mochthebest.io -> voting-app-vote:5000
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vote-route
  namespace: voting-app
spec:
  parentRefs:
    - name: voting-app-gateway
      sectionName: http-vote
  hostnames:
    - vote.mochthebest.io
  rules:
    - backendRefs:
        - name: voting-app-vote
          port: 5000
---
# HTTPRoute - result.mochthebest.io -> result:81
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: result-route
  namespace: voting-app
spec:
  parentRefs:
    - name: voting-app-gateway
      sectionName: http-result
  hostnames:
    - result.mochthebest.io
  rules:
    - backendRefs:
        - name: result
          port: 81
