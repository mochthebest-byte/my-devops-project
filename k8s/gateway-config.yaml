# ═══════════════════════════════════════════════════════════════
#  Gateway API — єдине джерело правди для експозу сервісів
#  Керується через ArgoCD (Application: gateway-config → k8s/)
# ═══════════════════════════════════════════════════════════════
#
#  Модель: один Gateway (= один ALB) → всі сервіси на субдоменах
#    vote.<domain>
#    result.<domain>
#    grafana.<domain>
#    keycloak.<domain>
#
#  ⚙️ Hostnames: замінити <domain> на ваш домен:
#     - EKS + Route53: vote.mochthebest.io, result.mochthebest.io, ...
#     - nip.io: vote.ALB_DNS.nip.io, result.ALB_DNS.nip.io, ...
#
#  🔐 HTTPS: активовано через self-signed сертифікат (*.nip.io).
#    Для продакшну: замінити secretName на Let's Encrypt (ClusterIssuer
#    letsencrypt-prod в k8s/cluster-issuer.yaml) або ACM (Terraform).
#    Для ACM додати annotation:
#      alb.ingress.kubernetes.io/certificate-arn: <ACM_ARN>

---
# ─── GatewayClass — AWS ALB ──────────────────────────────
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: aws-lb-gateway-class
spec:
  controllerName: gateway.k8s.aws/alb
  parametersRef:
    name: voting-app-alb-config
    namespace: kube-system
    group: gateway.k8s.aws
    kind: LoadBalancerConfiguration
  description: "AWS ALB — створює Application Load Balancer через Gateway API"

---
# ─── LoadBalancerConfiguration — налаштування ALB ──────
apiVersion: gateway.k8s.aws/v1beta1
kind: LoadBalancerConfiguration
metadata:
  name: voting-app-alb-config
  namespace: kube-system
spec:
  scheme: internet-facing
  ipAddressType: ipv4

---
# ─── Gateway — один ALB на всі сервіси ──────────────────
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: voting-app-gateway
  namespace: voting-app
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    # Зовнішній DNS — ExternalDNS створює A-записи для ALB
    external-dns.alpha.kubernetes.io/hostname: "vote.mochthebest.io, result.mochthebest.io, grafana.mochthebest.io, keycloak.mochthebest.io"
spec:
  gatewayClassName: aws-lb-gateway-class
  listeners:
    # ── HTTP (основний) ──────────────────────────────────
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    # ── HTTPS — Terminate TLS на ALB ───────────────────
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          # Self-signed: *.nip.io (k8s/cluster-issuer.yaml → Certificate)
          # Для продакшну: замінити на ACM-сертифікат через cert-manager
          - name: voting-app-tls
            kind: Secret

---
# ─── HTTPRoute — vote (frontend голосування) ─────────────
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vote-route
  namespace: voting-app
spec:
  parentRefs:
    - name: voting-app-gateway
  hostnames:
    - vote.nip.io
    - vote.mochthebest.io
  rules:
    - backendRefs:
        - name: voting-app-vote
          port: 5000

---
# ─── HTTPRoute — result (результати) ─────────────────────
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: result-route
  namespace: voting-app
spec:
  parentRefs:
    - name: voting-app-gateway
  hostnames:
    - result.nip.io
    - result.mochthebest.io
  rules:
    - backendRefs:
        - name: result
          port: 81

---
# ─── HTTPRoute — grafana ─────────────────────────────────
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-route
  namespace: monitoring
spec:
  parentRefs:
    - name: voting-app-gateway
      namespace: voting-app
  hostnames:
    - grafana.nip.io
    - grafana.mochthebest.io
  rules:
    - backendRefs:
        - name: monitoring-grafana
          port: 80

---
# ─── HTTPRoute — keycloak ────────────────────────────────
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak-route
  namespace: keycloak
spec:
  parentRefs:
    - name: voting-app-gateway
      namespace: voting-app
  hostnames:
    - keycloak.nip.io
    - keycloak.mochthebest.io
  rules:
    - backendRefs:
        - name: keycloak
          port: 8080
