---
# ─────────────────────────────────────────────────────
# GatewayClass — AWS Load Balancer Controller
# ─────────────────────────────────────────────────────
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: aws-lb-gateway-class
spec:
  controllerName: ingress.k8s.aws/gateway-api
  parametersRef:
    name: voting-app-alb-config
    group: gateway.k8s.aws
    kind: LoadBalancerConfiguration
  description: "AWS Load Balancer Controller — provisions ALB for Gateways"
---
# ─────────────────────────────────────────────────────
# LoadBalancerConfiguration — ALB settings
# ─────────────────────────────────────────────────────
apiVersion: gateway.k8s.aws/v1beta1
kind: LoadBalancerConfiguration
metadata:
  name: voting-app-alb-config
  namespace: voting-app
spec:
  scheme: internet-facing
  ipAddressType: ipv4
---
# ─────────────────────────────────────────────────────
# Gateway — Internet-facing ALB for voting-app
# ─────────────────────────────────────────────────────
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: voting-app-gateway
  namespace: voting-app
  annotations:
    # internet-facing → public ALB with its own DNS name
    alb.ingress.k8s.aws/scheme: internet-facing
    # IP target type — required when using the VPC CNI (EKS default)
    alb.ingress.k8s.aws/target-type: ip
spec:
  gatewayClassName: aws-lb-gateway-class
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
# ─────────────────────────────────────────────────────
# HTTPRoute — Route / → voting-app-vote:5000
# ─────────────────────────────────────────────────────
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vote-route
  namespace: voting-app
spec:
  parentRefs:
    - name: voting-app-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: voting-app-vote
          port: 5000
---
# ─────────────────────────────────────────────────────
# HTTPRoute — Route /result → result:81
# ─────────────────────────────────────────────────────
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: result-route
  namespace: voting-app
spec:
  parentRefs:
    - name: voting-app-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /result
      backendRefs:
        - name: result
          port: 81
