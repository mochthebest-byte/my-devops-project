---
# ─────────────────────────────────────────────────────
# GatewayClass — AWS Load Balancer Controller
# ─────────────────────────────────────────────────────
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: aws-lb-gateway-class
spec:
  controllerName: gateway.k8s.aws/alb
  parametersRef:
    name: voting-app-alb-config
    namespace: kube-system
    group: gateway.k8s.aws
    kind: LoadBalancerConfiguration
  description: "AWS Load Balancer Controller — provisions ALB for Gateways"
---
# ─────────────────────────────────────────────────────
# LoadBalancerConfiguration — ALB settings
# ─────────────────────────────────────────────────────
apiVersion: gateway.k8s.aws/v1beta1
kind: LoadBalancerConfiguration
metadata:
  name: voting-app-alb-config
  namespace: kube-system
spec:
  scheme: internet-facing
  ipAddressType: ipv4
---
# ─────────────────────────────────────────────────────
# Gateway — Internet-facing ALB for voting-app
# ─────────────────────────────────────────────────────
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: voting-app-gateway
  namespace: voting-app
  annotations:
    # internet-facing → public ALB with its own DNS name
    alb.ingress.k8s.aws/scheme: internet-facing
    # IP target type — required when using the VPC CNI (EKS default)
    alb.ingress.k8s.aws/target-type: ip
    # ExternalDNS: auto-create Route53 records pointing to the ALB
    external-dns.alpha.kubernetes.io/hostname: vote.example.com, result.example.com
    # ACM certificate for HTTPS listeners (self-signed cert imported to ACM)
    alb.ingress.k8s.aws/certificate-arn: arn:aws:acm:us-east-1:428156589409:certificate/be086015-cb4c-49bc-9852-de1d575a98c1
spec:
  gatewayClassName: aws-lb-gateway-class
  listeners:
    - name: http-vote
      protocol: HTTP
      port: 80
      hostname: vote.example.com
      allowedRoutes:
        namespaces:
          from: Same
    - name: http-result
      protocol: HTTP
      port: 80
      hostname: result.example.com
      allowedRoutes:
        namespaces:
          from: Same
    - name: https-keycloak
      protocol: HTTPS
      port: 443
      hostname: keycloak.34.194.59.190.nip.io
      tls:
        mode: Terminate
        certificateRefs:
          - name: nipio-tls
      allowedRoutes:
        namespaces:
          from: All
---
# ─────────────────────────────────────────────────────
# HTTPRoute — vote.example.com → voting-app-vote:5000
# ─────────────────────────────────────────────────────
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vote-route
  namespace: voting-app
spec:
  parentRefs:
    - name: voting-app-gateway
      sectionName: http-vote
  hostnames:
    - vote.example.com
  rules:
    - backendRefs:
        - name: voting-app-vote
          port: 5000
---
# ─────────────────────────────────────────────────────
# HTTPRoute — result.example.com → result:81
# ─────────────────────────────────────────────────────
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: result-route
  namespace: voting-app
spec:
  parentRefs:
    - name: voting-app-gateway
      sectionName: http-result
  hostnames:
    - result.example.com
  rules:
    - backendRefs:
        - name: result
          port: 81
