replicaCount: 1

global:
  awsAccountId: "AWS_ACCOUNT_ID"
  awsRegion: "eu-central-1"

image:
  repository: my-app/result
  digest: sha256:163a6d602bfc65e604facd5e070c877a56a612582ba0684defed3e901ba90f49
  tag: ""
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 81
  targetPort: 80
  protocol: TCP
  name: http

serviceAccount:
  create: false
  name: ""
  annotations: {}

pdb:
  create: true
  minAvailable: 1

scaledObject:
  create: true
  minReplicas: 1
  maxReplicas: 5
  triggers:
    - type: cpu
      metadata:
        type: Utilization
        value: "70"
    - type: memory
      metadata:
        type: Utilization
        value: "80"

networkPolicy:
  create: true

probes:
  readinessPath: /healthz
  livenessPath: /healthz
  healthzPort: 8081
  readinessDelay: 5
  livenessDelay: 15
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

resources:
  requests:
    memory: 128Mi
    cpu: 100m
  limits:
    memory: 256Mi
    cpu: 500m

postgresql:
  host: postgresql
  port: 5432
  database: db
  user: vote_user
  existingSecret: postgresql
  secretPasswordKey: password
