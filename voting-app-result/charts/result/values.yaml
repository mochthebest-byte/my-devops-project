replicaCount: 1

image:
  repository: 657954628960.dkr.ecr.eu-central-1.amazonaws.com/my-app/result
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 81
  targetPort: 80
  protocol: TCP
  name: http

resources:
  requests:
    memory: 128Mi
    cpu: 100m
  limits:
    memory: 256Mi
    cpu: 500m

postgresql:
  host: postgresql
  port: 5432
  database: db
  user: vote_user
  existingSecret: postgresql
  secretPasswordKey: password
