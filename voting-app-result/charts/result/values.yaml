replicaCount: 1

global:
  awsAccountId: "AWS_ACCOUNT_ID"
  awsRegion: "eu-central-1"

image:
  repository: my-app/result
  digest: sha256:bcf81fe9e08aff60b3d13359916684089bbbc468fa18c366b4938d32f950f098
  tag: ""
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 81
  targetPort: 8080
  protocol: TCP
  name: http

serviceAccount:
  create: true
  name: ""
  annotations: {}

pdb:
  create: true
  minAvailable: 1

scaledObject:
  create: true
  minReplicas: 1
  maxReplicas: 2
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "70"
    - type: memory
      metricType: Utilization
      metadata:
        value: "80"

networkPolicy:
  create: true

probes:
  readinessPath: /healthz
  livenessPath: /healthz
  healthzPort: 8081
  readinessDelay: 5
  livenessDelay: 15
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

resources:
  requests:
    memory: 128Mi
    cpu: 100m
  limits:
    memory: 256Mi
    cpu: 500m

postgresql:
  host: pg-vote-rw
  port: 5432
  database: app
  # ─── Dynamic credentials from VSO (VaultDatabaseSecret) ─────
  existingSecret: pg-vote-dynamic
  secretUsernameKey: username
  secretPasswordKey: password
