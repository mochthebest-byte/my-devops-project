replicaCount: 1

global:
  # ══════════════════════════════════════════════════════════
  #  AWS — перевизначається per-environment (ArgoCD helm.values)
  # ══════════════════════════════════════════════════════════
  awsAccountId: "AWS_ACCOUNT_ID"   # ⚠️ Замінити на ID вашого AWS акаунта
  awsRegion: "eu-central-1"

image:
  repository: my-app/result            # Тільки ім'я репо (full URL збирається в шаблоні)
  tag: stable                          # Overridden by CI via GitOps
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 81
  targetPort: 80
  protocol: TCP
  name: http

resources:
  requests:
    memory: 128Mi
    cpu: 100m
  limits:
    memory: 256Mi
    cpu: 500m

postgresql:
  host: postgresql
  port: 5432
  database: db
  user: vote_user
  existingSecret: postgresql
  secretPasswordKey: password
