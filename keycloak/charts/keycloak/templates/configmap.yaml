# ═══════════════════════════════════════════════════════════════
#  Keycloak Realm — myapp
# ═══════════════════════════════════════════════════════════════
#
#  ⚠️  Безпека секретів:
#     Client secret у цьому файлі — ПЛАЦЕБО.
#     Реальний секрет зберігається в AWS Secrets Manager
#     (/my-app/grafana-oidc) і постачається через ESO.
#
#     Після деплою:
#       kubectl -n keycloak exec deploy/keycloak -- \
#         /opt/keycloak/bin/kcadm.sh update clients/CLIENT_UUID \
#         -r myapp -s secret="$(kubectl get secret grafana-oidc-secret \
#           -n monitoring -o jsonpath='{.data.client-secret}' | base64 -d)"
#
#     У проді: автоматизувати через initContainer + kcadm.sh
# ═══════════════════════════════════════════════════════════════
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm-myapp
  namespace: {{ .Release.Namespace }}
data:
  myapp-realm.json: |
    {
      "realm": "myapp",
      "enabled": true,
      "displayName": "MyApp",
      "loginWithEmailAllowed": true,
      "registrationAllowed": false,
      "sslRequired": "external",
      "users": [
        {
          "username": "admin",
          "enabled": true,
          "email": "admin@example.com",
          "firstName": "Admin",
          "lastName": "Keycloak",
          "credentials": [{
            "type": "password",
            "value": "admin123",
            "temporary": false
          }],
          "realmRoles": ["grafana-admin"]
        },
        {
          "username": "user",
          "enabled": true,
          "email": "user@example.com",
          "firstName": "Regular",
          "lastName": "User",
          "credentials": [{
            "type": "password",
            "value": "user123",
            "temporary": false
          }],
          "realmRoles": ["grafana-editor"]
        }
      ],
      "roles": {
        "realm": [
          {
            "name": "grafana-admin",
            "description": "Grafana Administrator — maps to Admin role in Grafana"
          },
          {
            "name": "grafana-editor",
            "description": "Grafana Editor — maps to Editor role in Grafana"
          }
        ]
      },
      "clients": [
        {
          "clientId": "grafana",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "secret": "CHANGE_ME_VIA_SECRETS_MANAGER",
          "redirectUris": [
            "https://grafana.34.194.59.190.nip.io/login/generic_oauth"
          ],
          "webOrigins": ["+"],
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": false,
          "fullScopeAllowed": true,
          "attributes": {
            "post.logout.redirect.uris": "+"
          }
        }
      ]
    }
