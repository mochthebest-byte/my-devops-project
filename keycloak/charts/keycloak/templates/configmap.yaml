# ═══════════════════════════════════════════════════════════════
#  Keycloak Realm — {{ .Values.realm.name }}
# ═══════════════════════════════════════════════════════════════
#
#  ⚠️  Безпека секретів:
#     Client secret у цьому файлі — ПЛАЦЕБО.
#     Реальний секрет зберігається в AWS Secrets Manager
#     (/my-app/grafana-oidc) і постачається через ESO.
#
#     Після деплою:
#       kubectl -n keycloak exec deploy/keycloak -- \
#         /opt/keycloak/bin/kcadm.sh update clients/CLIENT_UUID \
#         -r {{ .Values.realm.name }} -s secret="$(kubectl get secret grafana-oidc-secret \
#           -n monitoring -o jsonpath='{.data.client-secret}' | base64 -d)"
#
#     У проді: автоматизувати через initContainer + kcadm.sh
# ═══════════════════════════════════════════════════════════════
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm-{{ .Values.realm.name }}
  namespace: {{ .Release.Namespace }}
data:
  {{ .Values.realm.name }}-realm.json: |
    {
      "realm": {{ .Values.realm.name | quote }},
      "enabled": true,
      "displayName": {{ .Values.realm.displayName | quote }},
      "loginWithEmailAllowed": {{ .Values.realm.loginWithEmailAllowed }},
      "registrationAllowed": {{ .Values.realm.registrationAllowed }},
      "sslRequired": {{ .Values.realm.sslRequired | quote }},
      "users": [
        {{- range $i, $u := .Values.realm.users }}
        {{- if $i }},{{ end }}
        {
          "username": {{ $u.username | quote }},
          "enabled": {{ $u.enabled }},
          "email": {{ $u.email | quote }},
          "firstName": {{ $u.firstName | quote }},
          "lastName": {{ $u.lastName | quote }},
          "credentials": [{
            "type": {{ $u.credentials.type | quote }},
            "value": {{ $u.credentials.value | quote }},
            "temporary": {{ $u.credentials.temporary }}
          }],
          "realmRoles": {{ $u.realmRoles | toJson }}
        }
        {{- end }}
      ],
      "roles": {
        "realm": [
        {{- range $i, $r := .Values.realm.roles }}
        {{- if $i }},{{ end }}
          {
            "name": {{ $r.name | quote }},
            "description": {{ $r.description | quote }}
          }
        {{- end }}
        ]
      },
      "clients": [
      {{- range $i, $c := .Values.realm.clients }}
      {{- if $i }},{{ end }}
        {
          "clientId": {{ $c.clientId | quote }},
          "enabled": {{ $c.enabled }},
          "protocol": {{ $c.protocol | quote }},
          "publicClient": {{ $c.publicClient }},
          "secret": {{ $c.secret | quote }},
          "redirectUris": {{ $c.redirectUris | toJson }},
          "webOrigins": {{ $c.webOrigins | toJson }},
          "standardFlowEnabled": {{ $c.standardFlowEnabled }},
          "implicitFlowEnabled": {{ $c.implicitFlowEnabled }},
          "directAccessGrantsEnabled": {{ $c.directAccessGrantsEnabled }},
          "serviceAccountsEnabled": {{ $c.serviceAccountsEnabled }},
          "fullScopeAllowed": {{ $c.fullScopeAllowed }},
          "attributes": {{ $c.attributes | toJson }}{{ if $c.protocolMappers }},
          "protocolMappers": {{ $c.protocolMappers | toJson }}{{ end }}
        }
      {{- end }}
      ]
    }
