---
# ExternalSecret — Keycloak PostgreSQL password
# Source: AWS Secrets Manager (/my-app/keycloak-db)
# Creates k8s Secret: keycloak-db (referenced by statefulset.yaml)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: keycloak-db
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: keycloak-db
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: KC_DB_PASSWORD
      remoteRef:
        key: /my-app/keycloak-db
        property: password
