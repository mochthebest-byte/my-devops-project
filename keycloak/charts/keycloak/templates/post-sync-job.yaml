{{- if .Values.syncJob.enabled }}
# ═══════════════════════════════════════════════════════════════
#  post-sync-job — синхронізація realm паролів/OIDC секретів
# ═══════════════════════════════════════════════════════════════
#  Заміняє postStart hook (який мовчки провалювався при збоях).
#  Запускається як окремий Job — не блокує старт Keycloak.
#  При збої — видно в логах Job'а, можна перезапустити:
#    kubectl delete job keycloak-post-sync -n keycloak
#    (ArgoCD auto-recreate при наступному sync)
# ═══════════════════════════════════════════════════════════════
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-post-sync
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: kcadm-sync
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          command:
            - /bin/bash
            - -eux  # -eu = exit on error/undefined, -x = verbose logging (C13 fix)
            - -c
            - |
              SERVER="http://localhost:{{ $.Values.service.port }}"
              REALM="{{ $.Values.realm.name }}"
              KCADM="/opt/keycloak/bin/kcadm.sh"
              CONFIG="/tmp/kcadm.config"

              # ── Wait for Keycloak ──
              for i in $(seq 1 60); do
                if $KCADM config credentials \
                  --config "$CONFIG" \
                  --server "$SERVER" --realm master \
                  --user "$KC_BOOTSTRAP_ADMIN_USERNAME" \
                  --password "$KC_BOOTSTRAP_ADMIN_PASSWORD"; then
                  echo "[kcadm] Keycloak ready after ${i}s"
                  break
                fi
                if [ "$i" -eq 60 ]; then
                  echo "[kcadm] ERROR: Keycloak not ready after 60s"; exit 1
                fi
                sleep 2
              done

              # ── Sync realm user passwords ──
              {{- range $u := $.Values.realm.users }}
              {{- if $u.credentials.secretKey }}
              if [ -f "/etc/realm-secrets/{{ $u.credentials.secretKey }}" ]; then
                PASSWORD=$(cat "/etc/realm-secrets/{{ $u.credentials.secretKey }}")
                USER_ID=$($KCADM get users --config "$CONFIG" \
                  -r "$REALM" -q username={{ $u.username }} \
                  --fields id 2>/dev/null \
                  | grep '"id"' \
                  | sed 's/.*"id" : "\(.*\)".*/\1/')
                if [ -n "$USER_ID" ]; then
                  $KCADM update users/"$USER_ID" --config "$CONFIG" \
                    -r "$REALM" \
                    -s "credentials=[{\"type\":\"password\",\"value\":\"$PASSWORD\",\"temporary\":false}]" \
                    && echo "[kcadm] Updated password for {{ $u.username }}"
                else
                  echo "[kcadm] WARNING: User {{ $u.username }} not found in realm"
                fi
              fi
              {{- end }}
              {{- end }}

              # ── Sync OIDC client secrets ──
              {{- range $c := $.Values.oidc.clients }}
              if [ -f "/etc/oidc-secrets/{{ $c.secretKey }}" ]; then
                CLIENT_SECRET=$(cat "/etc/oidc-secrets/{{ $c.secretKey }}")
                CLIENT_ID=$($KCADM get clients --config "$CONFIG" \
                  -r "{{ $c.realm }}" -q clientId={{ $c.clientId }} \
                  --fields id 2>/dev/null \
                  | grep '"id"' \
                  | sed 's/.*"id" : "\(.*\)".*/\1/')
                if [ -n "$CLIENT_ID" ]; then
                  $KCADM update clients/"$CLIENT_ID" --config "$CONFIG" \
                    -r "{{ $c.realm }}" \
                    -s "secret=$CLIENT_SECRET" \
                    && echo "[kcadm] Synced OIDC secret for client {{ $c.clientId }}"
                else
                  echo "[kcadm] WARNING: Client {{ $c.clientId }} not found in realm {{ $c.realm }}"
                fi
              fi
              {{- end }}
              echo "[kcadm] Sync complete"
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: {{ .Values.admin.user }}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.admin.existingSecret }}
                  key: {{ .Values.admin.secretKey }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: realm-secrets
              mountPath: /etc/realm-secrets
              readOnly: true
            - name: oidc-secrets
              mountPath: /etc/oidc-secrets
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: realm-secrets
          secret:
            secretName: {{ .Values.realm.existingSecret }}
        - name: oidc-secrets
          secret:
            secretName: {{ .Values.oidc.existingSecret }}
{{- end }}
