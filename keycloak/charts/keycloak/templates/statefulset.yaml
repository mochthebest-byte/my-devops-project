---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keycloak
  namespace: {{ .Release.Namespace }}
spec:
  serviceName: keycloak
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z {{ .Values.postgresql.host }} {{ .Values.postgresql.port }}; do
                echo "$(date) - Waiting for PostgreSQL..."; sleep 2
              done
              echo "$(date) - PostgreSQL is ready!"
      containers:
        - name: keycloak
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - start-dev
            - --import-realm
            - --http-port={{ .Values.service.port }}
            - --proxy-headers=xforwarded
            - --hostname-strict=false
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: {{ .Values.admin.user }}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.admin.existingSecret }}
                  key: {{ .Values.admin.secretKey }}
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL_HOST
              value: {{ .Values.postgresql.host }}
            - name: KC_DB_URL_PORT
              value: {{ .Values.postgresql.port | quote }}
            - name: KC_DB_DATABASE
              value: {{ .Values.postgresql.database }}
            - name: KC_DB_USERNAME
              value: {{ .Values.postgresql.user }}
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HOSTNAME
              value: {{ .Values.hostname }}
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.existingSecret }}
                  key: {{ .Values.postgresql.secretKey }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: {{ .Values.service.name }}
              containerPort: {{ .Values.service.targetPort }}
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/bash
                  - -c
                  - |
                    # ── Wait for Keycloak HTTP ──
                    for i in $(seq 1 30); do
                      if curl -sf http://localhost:{{ $.Values.service.port }}/realms/master > /dev/null 2>&1; then
                        echo "[postStart] Keycloak ready"
                        break
                      fi
                      sleep 2
                    done
                    # ── Authenticate kcadm.sh ──
                    /opt/keycloak/bin/kcadm.sh config credentials \
                      --server http://localhost:{{ $.Values.service.port }} \
                      --realm master \
                      --user "$KC_BOOTSTRAP_ADMIN_USERNAME" \
                      --password "$KC_BOOTSTRAP_ADMIN_PASSWORD" > /dev/null 2>&1 || {
                      echo "[postStart] kcadm.sh auth failed — skipping"
                      exit 0
                    }
                    # ── Update realm user passwords from Secret volume ──
                    {{- range $u := $.Values.realm.users }}
                    {{- if $u.credentials.secretKey }}
                    if [ -f "/etc/realm-secrets/{{ $u.credentials.secretKey }}" ]; then
                      PASSWORD=$(cat "/etc/realm-secrets/{{ $u.credentials.secretKey }}")
                      USER_ID=$(/opt/keycloak/bin/kcadm.sh get users \
                        -r {{ $.Values.realm.name }} \
                        -q username={{ $u.username }} \
                        --fields id 2>/dev/null | jq -r '.[0].id // empty')
                      if [ -n "$USER_ID" ]; then
                        /opt/keycloak/bin/kcadm.sh update users/"$USER_ID" \
                          -r {{ $.Values.realm.name }} \
                          -s "credentials: [{\"type\":\"password\",\"value\":\"$PASSWORD\",\"temporary\":false}]" \
                          > /dev/null 2>&1 && \
                          echo "[postStart] Updated password for {{ $u.username }}" || \
                          echo "[postStart] Failed to update password for {{ $u.username }}"
                      else
                        echo "[postStart] User {{ $u.username }} not found in realm"
                      fi
                    fi
                    {{- end }}
                    {{- end }}
                    exit 0
          readinessProbe:
            httpGet:
              path: /realms/master
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /realms/master
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: realm-import
              mountPath: /opt/keycloak/data/import
              readOnly: true
            - name: realm-secrets
              mountPath: /etc/realm-secrets
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: realm-import
          configMap:
            name: keycloak-realm-{{ .Values.realm.name }}
        - name: realm-secrets
          secret:
            secretName: {{ .Values.realm.existingSecret }}
