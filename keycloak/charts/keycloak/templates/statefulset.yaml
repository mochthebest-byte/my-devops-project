---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keycloak
  namespace: {{ .Release.Namespace }}
spec:
  serviceName: keycloak
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z {{ .Values.postgresql.host }} {{ .Values.postgresql.port }}; do
                echo "$(date) - Waiting for PostgreSQL..."; sleep 2
              done
              echo "$(date) - PostgreSQL is ready!"
        - name: sync-db-password
          image: postgres:16-alpine
          command:
            - sh
            - -eu
            - -c
            - |
              echo "$(date) - Syncing PostgreSQL password..."
              DB_PASSWORD=$(cat /etc/db-secrets/password)
              DB_HOST={{ .Values.postgresql.host }}
              DB_NAME={{ .Values.postgresql.database }}
              DB_USER={{ .Values.postgresql.user }}

              # Step 1 — test if current secret password already works
              if PGPASSWORD="$DB_PASSWORD" psql -h "$DB_HOST" -U "$DB_USER" -d "$DB_NAME" \
                -c "SELECT 1" > /dev/null 2>&1; then
                echo "$(date) - Password already in sync — nothing to do"
                exit 0
              fi
              echo "$(date) - Password mismatch detected — attempting fix..."

              # Step 2 — try as postgres superuser
              POSTGRES_PASSWORD=$(cat /etc/db-secrets/postgres-password)
              export PGPASSWORD="$POSTGRES_PASSWORD"
              if psql -h "$DB_HOST" -U postgres -d "$DB_NAME" \
                -c "ALTER USER ${DB_USER} WITH PASSWORD '${DB_PASSWORD}'" > /dev/null 2>&1; then
                echo "$(date) - Password synced successfully"
              else
                echo "$(date) - WARNING: could not sync password (postgres superuser auth failed)"
                echo "$(date) - Keycloak may fail to connect if DB password is out of sync"
                echo "$(date) - Fix manually: kubectl exec keycloak-postgresql-0 -n keycloak -- psql -U postgres -c \"ALTER USER ${DB_USER} WITH PASSWORD '...'\""
              fi
              echo "$(date) - Password sync complete"
          env:
            - name: PGSSLMODE
              value: disable
          volumeMounts:
            - name: db-secrets
              mountPath: /etc/db-secrets
              readOnly: true
      containers:
        - name: keycloak
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            {{- if eq .Values.mode "dev" }}
            - start-dev
            {{- else }}
            - start
            {{- end }}
            - --import-realm
            - --http-port={{ .Values.service.port }}
            - --proxy-headers=xforwarded
            - --hostname-strict=false
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: {{ .Values.admin.user }}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.admin.existingSecret }}
                  key: {{ .Values.admin.secretKey }}
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL_HOST
              value: {{ .Values.postgresql.host }}
            - name: KC_DB_URL_PORT
              value: {{ .Values.postgresql.port | quote }}
            - name: KC_DB_DATABASE
              value: {{ .Values.postgresql.database }}
            - name: KC_DB_USERNAME
              value: {{ .Values.postgresql.user }}
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HOSTNAME
              value: {{ .Values.hostname }}
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.existingSecret }}
                  key: {{ .Values.postgresql.secretKey }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: {{ .Values.service.name }}
              containerPort: {{ .Values.service.targetPort }}
          # ═══════════════════════════════════════════════════════════════
          #  postStart — ВИДАЛЕНО (C13 fix).
          #  Синхронізацію realm паролів/OIDC секретів перенесено
          #  в окремий Job (templates/post-sync-job.yaml).
          #  Причина: postStart мовчки провалювався, не блокуючи под,
          #  і його помилки були невидимі. Job — видимий, перезапускається.
          # ═══════════════════════════════════════════════════════════════
          readinessProbe:
            httpGet:
              path: /realms/master
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /realms/master
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: realm-import
              mountPath: /opt/keycloak/data/import
              readOnly: true
            - name: realm-secrets
              mountPath: /etc/realm-secrets
              readOnly: true
            - name: oidc-secrets
              mountPath: /etc/oidc-secrets
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: realm-import
          configMap:
            name: keycloak-realm-{{ .Values.realm.name }}
        - name: realm-secrets
          secret:
            secretName: {{ .Values.realm.existingSecret }}
        - name: db-secrets
          secret:
            secretName: {{ .Values.postgresql.existingSecret }}
        - name: oidc-secrets
          secret:
            secretName: {{ .Values.oidc.existingSecret }}
