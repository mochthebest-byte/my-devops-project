---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keycloak
  namespace: {{ .Release.Namespace }}
spec:
  serviceName: keycloak
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-db
          image: busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          command:
            - sh
            - -c
            - |
              until nc -z {{ .Values.postgresql.host }} {{ .Values.postgresql.port }}; do
                echo "$(date) - Waiting for PostgreSQL..."; sleep 2
              done
              echo "$(date) - PostgreSQL is ready!"
        - name: verify-db-connection
          image: postgres@sha256:e013e867e712fec275706a6c51c966f0bb0c93cfa8f51000f85a15f9865a28cb
          command:
            - sh
            - -eu
            - -c
            - |
              echo "$(date) - Verifying database connection..."
              DB_PASSWORD=$(cat /etc/db-secrets/password)
              DB_HOST={{ .Values.postgresql.host }}
              DB_NAME={{ .Values.postgresql.database }}
              DB_USER={{ .Values.postgresql.user }}

              if PGPASSWORD="$DB_PASSWORD" psql -h "$DB_HOST" -U "$DB_USER" -d "$DB_NAME" \
                -c "SELECT 1" > /dev/null 2>&1; then
                echo "$(date) - Database connection successful"
                exit 0
              else
                echo "$(date) - ERROR: Cannot connect to database with provided credentials"
                echo "Host: $DB_HOST, User: $DB_USER, Database: $DB_NAME"
                exit 1
              fi
          env:
            - name: PGSSLMODE
              value: disable
          volumeMounts:
            - name: db-secrets
              mountPath: /etc/db-secrets
              readOnly: true
      containers:
        - name: keycloak
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            {{- if eq .Values.mode "dev" }}
            - start-dev
            {{- else }}
            - start
            {{- end }}
            - --import-realm
            - --http-port={{ .Values.service.port }}
            {{- if .Values.tls.enabled }}
            - --https-port={{ .Values.tls.httpsPort }}
            {{- end }}
            - --proxy-headers=xforwarded
            - --hostname-strict=false
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: {{ .Values.admin.user }}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.admin.existingSecret }}
                  key: {{ .Values.admin.secretKey }}
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL_HOST
              value: {{ .Values.postgresql.host }}
            - name: KC_DB_URL_PORT
              value: {{ .Values.postgresql.port | quote }}
            - name: KC_DB_DATABASE
              value: {{ .Values.postgresql.database }}
            - name: KC_DB_USERNAME
              value: {{ .Values.postgresql.user }}
            - name: KC_HTTP_ENABLED
              value: "true"
            {{- if .Values.tls.enabled }}
            - name: KC_HTTPS_CERTIFICATE_FILE
              value: /etc/keycloak/certs/tls.crt
            - name: KC_HTTPS_CERTIFICATE_KEY_FILE
              value: /etc/keycloak/certs/tls.key
            {{- end }}
            - name: KC_HOSTNAME
              value: {{ .Values.hostname }}
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.existingSecret }}
                  key: {{ .Values.postgresql.secretKey }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: {{ .Values.service.name }}
              containerPort: {{ .Values.service.targetPort }}
            {{- if .Values.tls.enabled }}
            - name: https
              containerPort: {{ .Values.tls.httpsPort }}
            {{- end }}
          # ═══════════════════════════════════════════════════════════════
          #  postStart — ВИДАЛЕНО (C13 fix).
          #  Синхронізацію realm паролів/OIDC секретів перенесено
          #  в окремий Job (templates/post-sync-job.yaml).
          #  Причина: postStart мовчки провалювався, не блокуючи под,
          #  і його помилки були невидимі. Job — видимий, перезапускається.
          # ═══════════════════════════════════════════════════════════════
          readinessProbe:
            httpGet:
              path: /realms/master
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /realms/master
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: realm-import
              mountPath: /opt/keycloak/data/import
              readOnly: true
            - name: realm-secrets
              mountPath: /etc/realm-secrets
              readOnly: true
            - name: oidc-secrets
              mountPath: /etc/oidc-secrets
              readOnly: true
            {{- if .Values.tls.enabled }}
            - name: keycloak-tls
              mountPath: /etc/keycloak/certs
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: realm-import
          configMap:
            name: keycloak-realm-{{ .Values.realm.name }}
        - name: realm-secrets
          secret:
            secretName: {{ .Values.realm.existingSecret }}
        - name: db-secrets
          secret:
            secretName: {{ .Values.postgresql.existingSecret }}
        - name: oidc-secrets
          secret:
            secretName: {{ .Values.oidc.existingSecret }}
        {{- if .Values.tls.enabled }}
        - name: keycloak-tls
          secret:
            secretName: keycloak-tls
        {{- end }}
