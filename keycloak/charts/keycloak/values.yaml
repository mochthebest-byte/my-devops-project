# ═══════════════════════════════════════════════════════════════
#  Keycloak Helm chart — values
# ═══════════════════════════════════════════════════════════════

replicaCount: 1

# Keycloak mode: production | dev
#   production — start (вимагає hostname + proxy-headers, без HTTPS через термінацію на ALB)
#   dev       — start-dev (без HTTPS/hostname/DB вимог, для локального Kind)
mode: production

image:
  repository: quay.io/keycloak/keycloak
  tag: "26.0.0"
  digest: "sha256:db0d0f2c2eee8618a37a50e04affb69823e56687b4d1b676a847a4b85de62178"
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 8080
  targetPort: 8080
  name: http

# ─── TLS / HTTPS (Helm self-signed fallback until cert-manager syncs) ─
# certManager: true → cert-manager.io Certificate (ClusterIssuer)
# certManager: false → Helm sprig genSignedCert (self-signed, fallback)
# HTTP remains available on :8080 for in-pod health checks.
tls:
  enabled: true
  httpsPort: 8443
  certManager: true

postgresql:
  host: pg-keycloak-rw.keycloak.svc.cluster.local
  port: 5432
  database: keycloak
  user: app
  existingSecret: pg-keycloak-app
  secretKey: password

# ─── Grafana OIDC client ──────────────────────────────
# Синхронізує client-secret з grafana-oidc-secret в Keycloak
oidc:
  existingSecret: grafana-oidc-secret
  clients:
    - clientId: grafana
      realm: myapp
      secretKey: client-secret

admin:
  user: admin
  existingSecret: keycloak-admin
  secretKey: admin-password

hostname: keycloak.mochthebest.pp.ua

gateway:
  name: voting-app-gateway
  namespace: voting-app

resources:
  requests:
    memory: 1Gi
    cpu: 500m
  limits:
    memory: 2Gi
    cpu: 1000m

# ─── Realm конфігурація (myapp) ──────────────────────────
#
# ⚠️  Паролі користувачів realm — BOOTSTRAP-ONLY. Вони потрібні
#      для першого імпорту realmʼу. Після створення керування
#      паролями — через Keycloak UI/API (змінити пароль, email,
#      зовнішній IdP).
#
#      Для production / OCI — перевизначити в environment-specific
#      values (напр. k8s/oci/values-keycloak-oci.yaml).
#
#      Паролі в Git — це технічний борг: вони потрапляють у
#      ConfigMap, який не підтримує valueFrom.secretKeyRef.
#      Фікс: initContainer + Secret volume (див. TODO).
# ─────────────────────────────────────────────────────────
realm:
  name: myapp
  displayName: MyApp
  loginWithEmailAllowed: true
  registrationAllowed: false
  sslRequired: external
  existingSecret: keycloak-realm-users

  users:
    - username: admin
      enabled: true
      email: admin@example.com
      firstName: Admin
      lastName: Keycloak
      credentials:
        type: password
        value: placeholder-change-me
        secretKey: admin-password
        # sourced from AWS Secrets Manager via ESO
        temporary: false
      realmRoles: ["grafana-admin"]
    - username: user
      enabled: true
      email: user@example.com
      firstName: Regular
      lastName: User
      credentials:
        type: password
        value: placeholder-change-me
        secretKey: user-password
        # sourced from AWS Secrets Manager via ESO
        temporary: false
      realmRoles: ["grafana-editor"]

  roles:
    - name: grafana-admin
      description: Grafana Administrator — maps to Admin role in Grafana
    - name: grafana-editor
      description: Grafana Editor — maps to Editor role in Grafana

  clients:
    - clientId: grafana
      enabled: true
      protocol: openid-connect
      publicClient: false
      secret: CHANGE_ME_VIA_SECRETS_MANAGER
      redirectUris:
        - https://grafana.mochthebest.pp.ua/login/generic_oauth
      webOrigins: ["+"]
      standardFlowEnabled: true
      implicitFlowEnabled: false
      directAccessGrantsEnabled: false
      serviceAccountsEnabled: false
      fullScopeAllowed: true
      attributes:
        post.logout.redirect.uris: "+"
      protocolMappers:
        - name: realm roles
          protocol: openid-connect
          protocolMapper: oidc-usermodel-realm-role-mapper
          consentRequired: false
          config:
            multivalued: true
            userinfo.token.claim: true
            id.token.claim: true
            access.token.claim: true
            claim.name: roles
            jsonType.label: String

# ─── Sync Job (C13 fix) ────────────────────────────────
# Заміняє postStart kcadm (який мовчки провалювався).
# Запускається ArgoCD PostSync hook.
syncJob:
  enabled: true
