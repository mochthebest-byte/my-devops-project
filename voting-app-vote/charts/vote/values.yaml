replicaCount: 2

image:
  repository: vote
  tag: v2
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 5000
  targetPort: 80
  protocol: TCP
  name: http

postgresql:
  host: postgresql-postgresql
  port: 5432
  database: db
  user: vote_user
  existingSecret: postgresql
  secretPasswordKey: password

redis:
  host: redis-redis
  port: 6379
