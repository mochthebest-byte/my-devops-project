replicaCount: 2

global:
  # ══════════════════════════════════════════════════════════
  #  AWS — перевизначається per-environment (ArgoCD helm.values)
  # ══════════════════════════════════════════════════════════
  awsAccountId: "AWS_ACCOUNT_ID"   # ⚠️ Замінити на ID вашого AWS акаунта
  awsRegion: "eu-central-1"

image:
  repository: my-app/vote
  digest: sha256:65d09d0d98097aba758e48100a98383aae58d6bbfef5ae753ef6d193fa1b6c4e
  tag: ""
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 5000
  targetPort: 80
  protocol: TCP
  name: http

serviceAccount:
  create: false
  name: ""
  annotations: {}

pdb:
  create: true
  minAvailable: 1

scaledObject:
  create: true
  minReplicas: 1
  maxReplicas: 5
  triggers:
    - type: cpu
      metadata:
        type: Utilization
        value: "70"
    - type: memory
      metadata:
        type: Utilization
        value: "80"

networkPolicy:
  create: true

postgresql:
  host: postgresql
  port: 5432
  database: db
  user: vote_user
  existingSecret: postgresql
  secretPasswordKey: password

probes:
  readinessPath: /
  livenessPath: /
  healthzPort: 80
  readinessDelay: 5
  livenessDelay: 15
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

resources:
  requests:
    memory: 128Mi
    cpu: 100m
  limits:
    memory: 256Mi
    cpu: 500m

redis:
  host: redis-master
  port: 6379

# ─── Canary deployment (Argo Rollouts) ─────────────
canary:
  enabled: false
  steps:
    - setWeight: 20
    - pause: {duration: 30}
    - setWeight: 50
    - pause: {duration: 30}
    - setWeight: 80
    - pause: {duration: 15}
