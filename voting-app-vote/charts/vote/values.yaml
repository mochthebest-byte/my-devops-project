replicaCount: 2

image:
  # ⚠️ Хардкод Account ID — замінити при зміні AWS акаунта
  repository: 657954628960.dkr.ecr.eu-central-1.amazonaws.com/my-app/vote
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 5000
  targetPort: 80
  protocol: TCP
  name: http

postgresql:
  host: postgresql
  port: 5432
  database: db
  user: vote_user
  existingSecret: postgresql
  secretPasswordKey: password

resources:
  requests:
    memory: 128Mi
    cpu: 100m
  limits:
    memory: 256Mi
    cpu: 500m

redis:
  host: redis-master
  port: 6379
