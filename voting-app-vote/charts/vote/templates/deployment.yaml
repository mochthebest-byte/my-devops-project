{{- if .Values.canary.enabled }}
# Placeholder Deployment for ArgoCD health compatibility
# Only metadata + replicas:0 — no selector/template to avoid
# SharedResourceWarning with argo-rollout-vote Rollout.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vote.fullname" . }}
  labels:
    {{- include "vote.labels" . | nindent 4 }}
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: placeholder
      app.kubernetes.io/instance: {{ .Release.Name }}-placeholder
  template:
    metadata:
      labels:
        app.kubernetes.io/name: placeholder
        app.kubernetes.io/instance: {{ .Release.Name }}-placeholder
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "busybox"
{{- else }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vote.fullname" . }}
  labels:
    {{- include "vote.labels" . | nindent 4 }}
spec:
  {{- if not .Values.scaledObject.create }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "vote.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "vote.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "vote.fullname" . }}-sa
      {{- end }}
      automountServiceAccountToken: false
      # InitContainers: wait for PostgreSQL and RabbitMQ before starting
      initContainers:
        - name: wait-for-postgresql
          image: busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL at {{ .Values.postgresql.host }}:{{ .Values.postgresql.port }}..."
              until nc -z -w 2 "{{ .Values.postgresql.host }}" "{{ .Values.postgresql.port }}"; do
                echo "  PostgreSQL not ready yet, retrying in 2s..."
                sleep 2
              done
              echo "PostgreSQL is available"
          env:
            - name: POSTGRES_HOST
              value: {{ .Values.postgresql.host }}
            - name: POSTGRES_PORT
              value: {{ .Values.postgresql.port | quote }}
        - name: wait-for-rabbitmq
          image: busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "Waiting for RabbitMQ at {{ .Values.rabbitmq.host }}:{{ .Values.rabbitmq.port }}..."
              until nc -z -w 2 "{{ .Values.rabbitmq.host }}" "{{ .Values.rabbitmq.port }}"; do
                echo "  RabbitMQ not ready yet, retrying in 2s..."
                sleep 2
              done
              echo "RabbitMQ is available"
          env:
            - name: RABBITMQ_HOST
              value: {{ .Values.rabbitmq.host }}
            - name: RABBITMQ_PORT
              value: {{ .Values.rabbitmq.port | quote }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ if .Values.image.full }}{{ .Values.image.full }}{{ else }}{{ .Values.global.awsAccountId }}.dkr.ecr.{{ .Values.global.awsRegion }}.amazonaws.com/{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
              name: {{ .Values.service.name }}
              protocol: {{ .Values.service.protocol }}
          env:
            - name: POSTGRES_HOST
              value: {{ .Values.postgresql.host }}
            - name: POSTGRES_PORT
              value: {{ .Values.postgresql.port | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.database }}
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.user }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.existingSecret }}
                  key: {{ .Values.postgresql.secretPasswordKey }}
            - name: RABBITMQ_HOST
              value: {{ .Values.rabbitmq.host }}
            - name: RABBITMQ_PORT
              value: {{ .Values.rabbitmq.port | quote }}
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.rabbitmq.existingSecret }}
                  key: {{ .Values.rabbitmq.secretUsernameKey }}
            - name: RABBITMQ_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.rabbitmq.existingSecret }}
                  key: {{ .Values.rabbitmq.secretPasswordKey }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # Liveness/Readiness probes: HTTP check
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readinessPath }}
              port: {{ .Values.probes.healthzPort | default .Values.service.targetPort }}
            initialDelaySeconds: {{ .Values.probes.readinessDelay }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.livenessPath }}
              port: {{ .Values.probes.healthzPort | default .Values.service.targetPort }}
            initialDelaySeconds: {{ .Values.probes.livenessDelay }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.failureThreshold }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
