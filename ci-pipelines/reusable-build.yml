# ═══════════════════════════════════════════════════════════════
#  Reusable Workflow: Build & Push Docker → Update GitOps
# ═══════════════════════════════════════════════════════════════
#  Що робить:
#    1. Checkout сервісного репозиторію
#    2. OIDC-аутентифікація в AWS (без статичних ключів)
#    3. Логін в Amazon ECR
#    4. Build + Push Docker образу (теґ: git sha + latest)
#    5. Оновлення GitOps-репозиторію (новий image tag)
#
#  Де зберігати: mochthebest-byte/ci-pipelines/.github/workflows/reusable-build.yml
#
#  Як викликати (з сервісного репозиторію):
#    jobs:
#      deploy:
#        uses: mochthebest-byte/ci-pipelines/.github/workflows/reusable-build.yml@main
#        with:
#          image_name: voting-app
#          ecr_repository: voting-app
#          gitops_repo: mochthebest-byte/gitops
#          service_name: voting-app
#          aws_region: us-east-1
#          ci_role_arn: arn:aws:iam::123456789012:role/my-app-eks-github-ci
# ═══════════════════════════════════════════════════════════════

name: Reusable CI — Build, Push ECR, Update GitOps

on:
  workflow_call:
    inputs:
      # ── Обов'язкові параметри ────────────────────────
      image_name:
        description: "Docker image name (e.g., voting-app)"
        required: true
        type: string

      ecr_repository:
        description: "ECR repository name (e.g., voting-app)"
        required: true
        type: string

      gitops_repo:
        description: "GitOps repository (e.g., my-org/gitops-infra)"
        required: true
        type: string

      service_name:
        description: "Service name for GitOps manifest path (e.g., voting-app)"
        required: true
        type: string

      # ── AWS-специфічні параметри ─────────────────────
      aws_region:
        description: "AWS region for ECR"
        required: true
        type: string

      ci_role_arn:
        description: "ARN of the IAM role to assume via OIDC"
        required: true
        type: string

      # ── Необов'язкові параметри ──────────────────────
      docker_context:
        description: "Docker build context path (default: .)"
        required: false
        type: string
        default: "."

      gitops_manifest_path:
        description: "Path inside gitops_repo to the k8s manifest (default: apps/<service_name>/deployment.yaml)"
        required: false
        type: string
        default: ""

      gitops_branch:
        description: "Branch in the GitOps repo to update"
        required: false
        type: string
        default: "main"

      image_tag:
        description: "Custom image tag (default: git sha)"
        required: false
        type: string
        default: ""

    secrets:
      # Єдиний секрет — токен для запису в GitOps репозиторій
      gitops_token:
        description: "GitHub token with push access to the GitOps repo"
        required: true

# ─────────────────────────────────────────────────────────────
#  ENVIRONMENT: теги контейнера
# ─────────────────────────────────────────────────────────────
env:
  AWS_REGION: ${{ inputs.aws_region }}
  IMAGE_TAG: ${{ inputs.image_tag || github.sha }}

jobs:
  build-and-push:
    name: "Build & push ${{ inputs.image_name }}"
    runs-on: ubuntu-latest
    permissions:
      id-token: write      # Потрібно для OIDC токена
      contents: read       # Для checkout сервісного репо
    outputs:
      ecr_registry: ${{ steps.login-ecr.outputs.registry }}

    steps:
      # ── 1. Checkout сервісного коду ────────────────
      - name: Checkout service code
        uses: actions/checkout@v4

      # ── 2. OIDC → AWS (безпарольна аутентифікація) ──
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.ci_role_arn }}
          aws-region: ${{ inputs.aws_region }}
          # ═══ КЛЮЧОВІ ПАРАМЕТРИ ═══
          # role-to-assume: IAM Role, яку створив Terraform
          # aws-region: регіон ECR та EKS
          #
          # Жодних AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY —
          # GitHub сам запитує OIDC токен у token.actions.githubusercontent.com
          # і обмінює його на тимчасові AWS credentials.

      # ── 3. Login в Amazon ECR ───────────────────────
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ── 4. Setup Docker Buildx (multi-arch) ──────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 5. Build та Push Docker образу (multi-arch) ───
      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ inputs.ecr_repository }}
          IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
        run: |
          echo "Building ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          # Buildx multi-arch: amd64 + arm64 у одному шоті
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            --push \
            "${{ inputs.docker_context }}"

          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "registry=$ECR_REGISTRY" >> $GITHUB_OUTPUT

  update-gitops:
    name: "Update GitOps — ${{ inputs.service_name }}"
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: write

    steps:
      # ── 5. Checkout GitOps репозиторію ─────────────
      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.gitops_repo }}
          token: ${{ secrets.gitops_token }}
          ref: ${{ inputs.gitops_branch }}

      # ── 6. Оновлення image tag в маніфесті ─────────
      - name: Update image tag in k8s manifest
        env:
          SERVICE_NAME: ${{ inputs.service_name }}
          IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
          ECR_REGISTRY: ${{ needs.build-and-push.outputs.ecr_registry }}
          ECR_REPOSITORY: ${{ inputs.ecr_repository }}
          MANIFEST_PATH: ${{ inputs.gitops_manifest_path || format('apps/{0}/deployment.yaml', inputs.service_name) }}
        run: |
          NEW_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          echo "Updating ${MANIFEST_PATH} → image: ${NEW_IMAGE}"

          if [ ! -f "${MANIFEST_PATH}" ]; then
            echo "❌ Manifest not found: ${MANIFEST_PATH}"
            echo "   Create the file first or set gitops_manifest_path"
            exit 1
          fi

          # Визначаємо тип файлу: Helm values.yaml чи plain deployment.yaml
          if grep -q "^image:" "${MANIFEST_PATH}"; then
            # Plain deployment.yaml: image: repo:tag
            echo "→ Detected: plain Deployment manifest"
            sed -i "s|image:.*${ECR_REPOSITORY}:.*|image: ${NEW_IMAGE}|g" "${MANIFEST_PATH}"
          elif grep -q "^  tag:" "${MANIFEST_PATH}"; then
            # Helm values.yaml: tag: latest
            echo "→ Detected: Helm values.yaml"
            sed -i "s|^  tag:.*|  tag: ${IMAGE_TAG}|g" "${MANIFEST_PATH}"
          else
            echo "⚠️  Unknown manifest format — trying plain image: replacement"
            sed -i "s|image:.*${ECR_REPOSITORY}:.*|image: ${NEW_IMAGE}|g" "${MANIFEST_PATH}"
          fi

          echo "✅ Updated:"
          grep -E "(image:|  tag:)" "${MANIFEST_PATH}" || echo "(no image/tag line found)"

      # ── 7. Commit + Push в GitOps репозиторій ──────
      - name: Commit and push changes
        env:
          SERVICE_NAME: ${{ inputs.service_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "ℹ️  No changes to commit"
            exit 0
          fi

          git commit -m "chore(${SERVICE_NAME}): bump image to ${IMAGE_TAG}

          Automated by CI pipeline (GitHub Actions OIDC)."
          git push origin ${{ inputs.gitops_branch }}

          echo "✅ Pushed to ${GITOPS_REPO}:${GITOPS_BRANCH}"
