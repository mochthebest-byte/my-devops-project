# ═══════════════════════════════════════════════════════════════
#  Reusable Workflow: Build & Push Docker → Update GitOps
# ═══════════════════════════════════════════════════════════════
#  Місцезнаходження:
#    mochthebest-byte/ci-pipelines/.github/workflows/reusable-build.yml
#
#  Призначення:
#    1. Checkout сервісного репозиторію
#    2. OIDC-аутентифікація в AWS (без статичних ключів)
#    3. Логін в Amazon ECR
#    4. Multi-arch Build + Push Docker образу (linux/amd64 + linux/arm64)
#    5. Оновлення GitOps-репозиторію (новий image tag)
#
#  Викликається через:
#    uses: mochthebest-byte/ci-pipelines/.github/workflows/reusable-build.yml@main
#
#  Приклад виклику:
#    jobs:
#      build-and-deploy:
#        uses: mochthebest-byte/ci-pipelines/.github/workflows/reusable-build.yml@main
#        with:
#          image_name: vote
#          ecr_repository: my-app/vote
#          service_name: vote
#          aws_region: us-east-1
#          ci_role_arn: arn:aws:iam::428156589409:role/my-app-eks-github-ci
#        secrets:
#          gitops_token: ${{ secrets.GITOPS_PAT }}
# ═══════════════════════════════════════════════════════════════

name: Reusable CI — Build, Push ECR, Update GitOps

on:
  workflow_call:
    inputs:
      # ── Обов'язкові параметри ────────────────────────
      image_name:
        description: "Docker image name (e.g., vote)"
        required: true
        type: string

      ecr_repository:
        description: "ECR repository name (e.g., my-app/vote)"
        required: true
        type: string

      gitops_repo:
        description: "GitOps repository (e.g., my-org/gitops-infra)"
        required: true
        type: string

      service_name:
        description: "Service name for GitOps manifest path"
        required: true
        type: string

      # ── AWS-специфічні параметри ─────────────────────
      aws_region:
        description: "AWS region for ECR"
        required: true
        type: string

      ci_role_arn:
        description: "ARN of the IAM role to assume via OIDC"
        required: true
        type: string

      # ── Необов'язкові параметри ──────────────────────
      docker_context:
        description: "Docker build context path (default: .)"
        required: false
        type: string
        default: "."

      gitops_manifest_path:
        description: "Path inside gitops_repo to the k8s manifest"
        required: false
        type: string
        default: ""

      gitops_branch:
        description: "Branch in the GitOps repo to update"
        required: false
        type: string
        default: "main"

      image_tag:
        description: "Custom image tag (default: git sha)"
        required: false
        type: string
        default: ""

      build_platforms:
        description: "Target platforms for multi-arch build"
        required: false
        type: string
        default: "linux/amd64,linux/arm64"

    secrets:
      gitops_token:
        description: "GitHub token with push access to the GitOps repo"
        required: true

# ─────────────────────────────────────────────────────────────
env:
  AWS_REGION: ${{ inputs.aws_region }}
  IMAGE_TAG: ${{ inputs.image_tag || github.sha }}

jobs:
  build-and-push:
    name: "Build & push ${{ inputs.image_name }}"
    runs-on: ubuntu-latest
    permissions:
      id-token: write       # OIDC: GitHub → AWS (без ключів)
      contents: read         # Для checkout сервісного репо
    outputs:
      ecr_registry: ${{ steps.login-ecr.outputs.registry }}
      image_tag: ${{ env.IMAGE_TAG }}

    steps:
      # ── 1. Checkout коду сервісу ─────────────────────
      - name: Checkout service code
        uses: actions/checkout@v4

      # ── 2. OIDC → AWS (Workload Identity Federation) ──
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.ci_role_arn }}
          aws-region: ${{ inputs.aws_region }}
          # ══════════════════════════════════════════════
          #  Жодних AWS_ACCESS_KEY_ID / SECRET_ACCESS_KEY!
          #  GitHub отримує OIDC-токен від
          #  token.actions.githubusercontent.com і обмінює
          #  його на тимчасові AWS credentials.
          # ══════════════════════════════════════════════

      # ── 3. Login в Amazon ECR ───────────────────────
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ── 4. Setup Docker Buildx ───────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-flags: --debug
          driver-opts: network=host

      # ── 5. Build та Push (multi-arch) ────────────────
      - name: Build and push multi-arch image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ inputs.ecr_repository }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          echo "🏗️  Building ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          echo "   Platforms: ${{ inputs.build_platforms }}"

          # Buildx multi-arch: один shot для amd64 + arm64
          docker buildx build \
            --platform "${{ inputs.build_platforms }}" \
            -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}" \
            -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest" \
            --push \
            --cache-from "type=registry,ref=${ECR_REGISTRY}/${ECR_REPOSITORY}:latest" \
            --cache-to "type=inline" \
            "${{ inputs.docker_context }}"

          echo "✅  Pushed ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          echo "image=${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "registry=${ECR_REGISTRY}" >> "$GITHUB_OUTPUT"

  update-gitops:
    name: "Update GitOps — ${{ inputs.service_name }}"
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: write
    if: success()  # Не оновлюємо GitOps, якщо build зламався

    steps:
      # ── 6. Checkout GitOps репозиторію ──────────────
      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.gitops_repo }}
          token: ${{ secrets.gitops_token }}
          ref: ${{ inputs.gitops_branch }}

      # ── 7. Оновлення image tag в маніфесті ──────────
      - name: Update image tag in k8s manifest
        id: update-manifest
        env:
          SERVICE_NAME: ${{ inputs.service_name }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          ECR_REGISTRY: ${{ needs.build-and-push.outputs.ecr_registry }}
          ECR_REPOSITORY: ${{ inputs.ecr_repository }}
          MANIFEST_PATH: ${{ inputs.gitops_manifest_path || format('apps/{0}/values.yaml', inputs.service_name) }}
        run: |
          NEW_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          echo "Updating ${MANIFEST_PATH} → image: ${NEW_IMAGE}"

          if [ ! -f "${MANIFEST_PATH}" ]; then
            echo "❌ Manifest not found: ${MANIFEST_PATH}"
            echo ""
            echo "   Очікувані файли в GitOps репозиторії:"
            echo "     - apps/vote/values.yaml"
            echo "     - apps/result/values.yaml"
            echo "     - apps/worker/values.yaml"
            echo ""
            echo "   Або вкажіть gitops_manifest_path явно."
            exit 1
          fi

          # Визначаємо тип файлу
          if grep -q "^image:" "${MANIFEST_PATH}"; then
            echo "→ Detected: plain Deployment manifest"
            sed -i "s|image:.*${ECR_REPOSITORY}:.*|image: ${NEW_IMAGE}|g" "${MANIFEST_PATH}"
          elif grep -q "^  tag:" "${MANIFEST_PATH}"; then
            echo "→ Detected: Helm values.yaml"
            sed -i "s|^  tag:.*|  tag: ${IMAGE_TAG}|g" "${MANIFEST_PATH}"
          else
            echo "⚠️  Unknown format — trying image: replacement"
            sed -i "s|image:.*${ECR_REPOSITORY}:.*|image: ${NEW_IMAGE}|g" "${MANIFEST_PATH}"
          fi

          echo "✅ Updated:"
          grep -E "(image:|  tag:)" "${MANIFEST_PATH}" || echo "(no image/tag line found)"

      # ── 8. Commit + Push в GitOps ────────────────────
      - name: Commit and push changes
        env:
          SERVICE_NAME: ${{ inputs.service_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "ℹ️  No changes to commit — already up to date."
            exit 0
          fi

          git commit -m "chore(${SERVICE_NAME}): bump image to ${IMAGE_TAG}

          Automated by CI pipeline.
          Triggered by: ${{ github.repository }}@${{ github.sha }}
          OIDC auth — no static keys."

          git push origin ${{ inputs.gitops_branch }}

          echo "✅ Pushed to ${GITOPS_REPO}:${GITOPS_BRANCH}"
