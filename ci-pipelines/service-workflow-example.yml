# CI/CD - Service repository template
#
# Save to:
#   mochthebest-byte/voting-app/.github/workflows/ci.yml
#   (similarly for worker, result, and other services)
#
# What it does:
#   1. Trivy vulnerability scan (on every PR + push)
#   2. Multi-arch build + push to ECR (main only)
#   3. Update GitOps repo via ArgoCD
#
# Features:
#   - Uses central pipeline, no CI code duplication
#   - OIDC auth to AWS (no static keys)
#   - Concurrency - race condition protection on pushes
#   - Matrix strategy - single CI for vote, result, worker

name: CI - Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Race condition protection:
# If 2 pushes happen in a row, cancel the previous run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Step 1: Code check (PR + push)
  test:
    name: "Code quality"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL

  # Step 2: Build + Push ECR + GitOps (main only)
  build-and-deploy:
    name: "Build & deploy ${{ matrix.service }}"
    needs: test
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false      # If vote fails, result still builds
      matrix:
        include:
          - service: vote
            ecr_repo: my-app/vote
            docker_context: vote
          - service: result
            ecr_repo: my-app/result
            docker_context: result
          - service: worker
            ecr_repo: my-app/worker
            docker_context: worker

    # Call central pipeline - no CI code duplication
    uses: mochthebest-byte/ci-pipelines/.github/workflows/reusable-build.yml@main
    with:
      image_name: ${{ matrix.service }}
      ecr_repository: ${{ matrix.ecr_repo }}
      service_name: ${{ matrix.service }}
      docker_context: ${{ matrix.docker_context }}

      # AWS OIDC
      aws_region: us-east-1
      ci_role_arn: arn:aws:iam::428156589409:role/my-app-eks-github-ci

      # GitOps
      gitops_repo: mochthebest-byte/gitops
      gitops_branch: main

    secrets:
      gitops_token: ${{ secrets.GITOPS_PAT }}
