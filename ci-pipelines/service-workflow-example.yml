# ═══════════════════════════════════════════════════════════════
#  CI/CD — сервісний репозиторій (template)
# ═══════════════════════════════════════════════════════════════
#  Куди зберігати:
#    mochthebest-byte/voting-app/.github/workflows/ci.yml
#    (аналогічно для worker, result та інших сервісів)
#
#  Що робить:
#    1. Trivy vulnerability scan (на кожен PR + push)
#    2. Multi-arch build + push в ECR (тільки main)
#    3. Оновлює GitOps-репозиторій через ArgoCD
#
#  Особливості:
#    • Використовує центральний пайплайн без дублювання коду
#    • OIDC-аутентифікація в AWS (без статичних ключів)
#    • Concurrency — захист від race condition при pushes
#    • Matrix strategy — один CI для vote, result, worker
# ═══════════════════════════════════════════════════════════════

name: CI — Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Захист від race condition:
# Якщо 2 pushes поспіль — зупиняємо попередній run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Крок 1: Перевірка коду (PR + push) ──────────────────
  test:
    name: "Code quality"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL

  # ─── Крок 2: Build + Push ECR + GitOps (тільки main) ──
  build-and-deploy:
    name: "Build & deploy ${{ matrix.service }}"
    needs: test
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false      # Якщо vote впав — result все одно збираємо
      matrix:
        include:
          - service: vote
            ecr_repo: my-app/vote
            docker_context: vote
          - service: result
            ecr_repo: my-app/result
            docker_context: result
          - service: worker
            ecr_repo: my-app/worker
            docker_context: worker

    # Викликаємо центральний пайплайн — без дублювання CI-коду
    uses: mochthebest-byte/ci-pipelines/.github/workflows/reusable-build.yml@main
    with:
      image_name: ${{ matrix.service }}
      ecr_repository: ${{ matrix.ecr_repo }}
      service_name: ${{ matrix.service }}
      docker_context: ${{ matrix.docker_context }}

      # AWS OIDC
      aws_region: us-east-1
      ci_role_arn: arn:aws:iam::428156589409:role/my-app-eks-github-ci

      # GitOps
      gitops_repo: mochthebest-byte/gitops
      gitops_branch: main
      # gitops_manifest_path: apps/${{ matrix.service }}/values.yaml

    secrets:
      gitops_token: ${{ secrets.GITOPS_PAT }}
