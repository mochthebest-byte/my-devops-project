---
# ────────────────────────────────────────────────
# GatewayClass — AWS Load Balancer Controller
# ────────────────────────────────────────────────
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: aws-lb-gateway-class
spec:
  controllerName: gateway.k8s.aws/alb
  description: "AWS Load Balancer Controller — provisions ALB/NLB for Gateways"
---
# ────────────────────────────────────────────────
# Gateway — Internet-facing ALB for voting-app
# ────────────────────────────────────────────────
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: voting-app-gateway
  namespace: voting-app
  annotations:
    # Creates an internet-facing ALB (default is internal)
    alb.ingress.k8s.aws/scheme: internet-facing
spec:
  gatewayClassName: aws-lb-gateway-class
  listeners:
    - name: http-vote
      protocol: HTTP
      port: 80
      hostname: vote.example.com
      allowedRoutes:
        namespaces:
          from: Same
    - name: http-result
      protocol: HTTP
      port: 80
      hostname: result.example.com
      allowedRoutes:
        namespaces:
          from: Same
---
# ────────────────────────────────────────────────
# HTTPRoute — vote.example.com → voting-app-vote:5000
# ────────────────────────────────────────────────
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vote-route
  namespace: voting-app
spec:
  parentRefs:
    - name: voting-app-gateway
      sectionName: http-vote
  hostnames:
    - vote.example.com
  rules:
    - backendRefs:
        - name: voting-app-vote
          port: 5000
---
# ────────────────────────────────────────────────
# HTTPRoute — result.example.com → result:81
# ────────────────────────────────────────────────
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: result-route
  namespace: voting-app
spec:
  parentRefs:
    - name: voting-app-gateway
      sectionName: http-result
  hostnames:
    - result.example.com
  rules:
    - backendRefs:
        - name: result
          port: 81
