name: 🚀 Deploy voting-app

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Service to deploy (all/vote/result/worker)"
        required: true
        default: "all"
        type: choice
        options:
          - "all"
          - "vote"
          - "result"
          - "worker"

      image_tag:
        description: "Docker image tag (default: git sha)"
        required: false
        type: string
        default: ""

      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod

  repository_dispatch:
    types: [deploy-voting-app]

env:
  AWS_REGION: eu-central-1
  # 🎯 IAM role for GitHub Actions CI (OIDC).
  #     Account ID береться з GitHub Actions variable "AWS_ACCOUNT_ID".
  #     Якщо змінна не встановлена — встановити:
  #       gh variable set AWS_ACCOUNT_ID --repo mochthebest-byte/my-devops-project
  #     Значення: terraform output -state=infra-aws/terraform.tfstate aws_account_id
  CI_ROLE_NAME: my-app-eks-github-ci
  GITOPS_REPO: mochthebest-byte/gitops
  GITOPS_BRANCH: main

jobs:
  resolve-matrix:
    name: "Resolve service matrix"
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.set-matrix.outputs.services }}
    steps:
      - id: set-matrix
        run: |
          if [ "${{ inputs.service }}" = "all" ]; then
            echo 'services=["vote","result","worker"]' >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.service }}" = "vote" ]; then
            echo 'services=["vote"]' >> "$GITHUB_OUTPUT"
          else
            echo 'services=["${{ inputs.service }}"]' >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: "Build & deploy ${{ matrix.service }}"
    runs-on: ubuntu-latest
    needs: resolve-matrix
    permissions:
      id-token: write
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.resolve-matrix.outputs.services) }}

    steps:
      # Clone this repo (enhanced Dockerfiles + healthz.js/wsgi.py)
      - name: Checkout dockerfiles
        uses: actions/checkout@v4
        with:
          path: dockerfiles

      # Clone voting-app source (contains all 3 services)
      - name: Checkout voting-app source code
        uses: actions/checkout@v4
        with:
          repository: mochthebest-byte/voting-app
          ref: main
          path: src/voting-app

      # OIDC auth to AWS (no static keys)
      # Account ID з GitHub variable AWS_ACCOUNT_ID (не хардкод)
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ env.CI_ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}

      # Login to ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Multi-arch build and push
      - name: Build and push multi-arch image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: my-app/${{ matrix.service }}
          IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
        run: |
          # Voting-app repo layout: vote/Dockerfile, result/Dockerfile, worker/Dockerfile
          DOCKER_CTX="src/voting-app/${{ matrix.service }}"

          # Copy enhanced Dockerfile + healthz support from this repo
          cp "dockerfiles/voting-app-${{ matrix.service }}/Dockerfile" "${DOCKER_CTX}/"
          cp "dockerfiles/voting-app-${{ matrix.service }}/wsgi.py" "${DOCKER_CTX}/" 2>/dev/null || true
          cp "dockerfiles/voting-app-${{ matrix.service }}/healthz.js" "${DOCKER_CTX}/" 2>/dev/null || true

          echo "Building ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          echo "  Context: ${DOCKER_CTX}"
          echo "  Platforms: linux/amd64,linux/arm64"

          test -f "${DOCKER_CTX}/Dockerfile" || {
            echo "ERROR: Dockerfile not found at ${DOCKER_CTX}/Dockerfile"
            ls -la "${DOCKER_CTX}/" || true
            exit 1
          }

          # Single-platform build for local CI checks (Trivy + SBOM)
          docker buildx build \
            --platform linux/amd64 \
            -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}" \
            --load \
            --cache-from "type=registry,ref=${ECR_REGISTRY}/${ECR_REPOSITORY}:latest" \
            --cache-to "type=inline" \
            "${DOCKER_CTX}"

          echo "Built ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          {
            echo "image=${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
            echo "registry=${ECR_REGISTRY}"
            echo "tag=${IMAGE_TAG}"
          } >> "$GITHUB_OUTPUT"

      # 🔒 Trivy scan — warn-only until CVE fix pass
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.build-image.outputs.registry }}/my-app/${{ matrix.service }}:${{ steps.build-image.outputs.tag }}
          format: table
          exit-code: 0
          severity: CRITICAL
          ignore-unfixed: true

      # 📦 Generate CycloneDX SBOM
      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.build-image.outputs.registry }}/my-app/${{ matrix.service }}:${{ steps.build-image.outputs.tag }}
          format: cyclonedx
          output: sbom-${{ matrix.service }}.json
          ignore-unfixed: true
          exit-code: 0    # Don't fail on vulnerabilities — this is for SBOM, not scanning

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service }}-${{ inputs.image_tag || github.sha }}
          path: sbom-${{ matrix.service }}.json
          retention-days: 30

      - name: Push multi-arch image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: my-app/${{ matrix.service }}
          IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}" \
            -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest" \
            --push \
            --cache-from "type=registry,ref=${ECR_REGISTRY}/${ECR_REPOSITORY}:latest" \
            --cache-to "type=inline" \
            "src/voting-app/${{ matrix.service }}"

      # Update GitOps repo with new image tag (optional — ArgoCD is primary)
      - name: Checkout GitOps repo
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_PAT }}
          ref: ${{ env.GITOPS_BRANCH }}
          path: gitops

      # Install yq for structured YAML patching
      - name: Install yq
        continue-on-error: true
        uses: mikefarah/yq@v4.44.3

      - name: Update image tag in GitOps
        continue-on-error: true
        id: update-manifest
        env:
          IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
          MANIFEST_PATH: apps/${{ matrix.service }}/values.yaml
        run: |
          cd gitops

          if [ ! -f "${MANIFEST_PATH}" ]; then
            echo "Manifest not found: ${MANIFEST_PATH}"
            ls apps/ 2>/dev/null || echo "apps/ not found"
            exit 1
          fi

          echo "Updating ${MANIFEST_PATH} -> tag: ${IMAGE_TAG}"

          # Use yq for structured YAML patching
          if yq eval '.image' "${MANIFEST_PATH}" | grep -q "null"; then
            # Helm values.yaml with tag: field
            yq eval ".image.tag = \"${IMAGE_TAG}\"" -i "${MANIFEST_PATH}"
          else
            # Plain Deployment manifest with image: field
            NEW_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
            yq eval ".spec.template.spec.containers[0].image = \"${NEW_IMAGE}\"" -i "${MANIFEST_PATH}"
          fi

          echo "Updated:"
          yq eval '.image' "${MANIFEST_PATH}" 2>/dev/null || yq eval '.spec.template.spec.containers[0].image' "${MANIFEST_PATH}"

      - name: Commit and push changes
        continue-on-error: true
        env:
          SERVICE_NAME: ${{ matrix.service }}
        run: |
          cd gitops
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore(${SERVICE_NAME}): bump image to ${{ inputs.image_tag || github.sha }}
          Automated by my-devops-project CI via OIDC."

          git push origin ${{ env.GITOPS_BRANCH }}
          echo "Pushed to ${GITOPS_REPO}:${GITOPS_BRANCH}"
