# CI — Integration test on ephemeral Kind cluster
# Creates a temporary Kind cluster, deploys all charts via Helm,
# runs tests, then tears everything down.
#
# Runs on every push to any branch (not just main).
name: CI — Kind Integration Test

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main]

env:
  NAMESPACE: voting-app

jobs:
  kind-test:
    name: "Kind: deploy + test"
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - uses: actions/checkout@v4

      # Step 2: Create Kind cluster (3 nodes: 1 cp, 2 workers)
      - name: Create Kind cluster
        uses: helm/kind-action@v1.14.0
        with:
          config: kind-config.yaml
          cluster_name: voting-app-local

      # Step 3: Install ingress-nginx
      - name: Install ingress-nginx
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/kind/deploy.yaml
          kubectl wait --namespace ingress-nginx \
            --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller \
            --timeout=120s

      # Step 4: Add Helm repos
      - name: Add Helm repos
        run: |
          helm repo add cnpg https://cloudnative-pg.github.io/charts
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update

      - name: Create namespaces
        run: |
          kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace cnpg-system --dry-run=client -o yaml | kubectl apply -f -

      # Step 5: Install CloudNativePG operator
      - name: Install CloudNativePG operator
        run: |
          helm upgrade --install cnpg cloudnative-pg/cloudnative-pg \
            --namespace cnpg-system --wait

      - name: Create CNPG cluster
        run: |
          kubectl apply -f - << 'EOF'
          apiVersion: postgresql.cnpg.io/v1
          kind: Cluster
          metadata:
            name: pg-ci
            namespace: ${{ env.NAMESPACE }}
          spec:
            instances: 1
            imageName: ghcr.io/cloudnative-pg/postgresql:18
            bootstrap:
              initdb:
                database: db
                owner: app
            storage:
              size: 1Gi
          EOF
          kubectl wait --for=condition=ready cluster/pg-ci -n ${{ env.NAMESPACE }} --timeout=120s

      # Step 6: Install RabbitMQ Cluster Operator + Cluster
      - name: Install RabbitMQ Cluster Operator
        run: |
          helm repo add rabbitmq https://rabbitmq.github.io/cluster-operator/
          helm repo update
          helm upgrade --install rabbitmq-cluster-operator rabbitmq/cluster-operator \
            --namespace rabbitmq-system --create-namespace --wait
          helm upgrade --install rabbitmq charts/rabbitmq \
            --namespace ${{ env.NAMESPACE }} --wait

      # Step 7: Wait for PostgreSQL and RabbitMQ
      - name: Wait for DBs
        run: |
          kubectl wait --namespace ${{ env.NAMESPACE }} \
            --for=condition=ready pod \
            -l cluster=pg-ci --timeout=120s
          kubectl wait --namespace ${{ env.NAMESPACE }} \
            --for=condition=ready pod \
            -l app.kubernetes.io/name=rabbitmq --timeout=120s

      # Step 8: Build Docker images locally (in Kind's registry)
      - name: Build Docker images
        run: |
          docker build -t vote:latest voting-app-vote/
          docker build -t result:latest voting-app-result/
          docker build -t worker:latest voting-app-worker/
          kind load docker-image vote:latest result:latest worker:latest \
            --name voting-app-local

      # Step 8b: Trivy vulnerability scan on built images
      - name: Trivy scan images
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'vote:latest'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'
          ignore-unfixed: true

      - name: Trivy scan result
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'result:latest'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'
          ignore-unfixed: true

      - name: Trivy scan worker
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'worker:latest'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'
          ignore-unfixed: true

      # Step 9: Deploy Helm charts (disable CRD-dependent resources — no KEDA in Kind)
      - name: Deploy Helm charts
        run: |
          helm upgrade --install vote voting-app-vote/charts/vote \
            --namespace ${{ env.NAMESPACE }} \
            --set image.full=vote:latest \
            --set image.pullPolicy=IfNotPresent \
            --set scaledObject.create=false --set pdb.create=false \
            --set networkPolicy.create=false \
            --set postgresql.host=pg-ci-rw \
            --set rabbitmq.host=rabbitmq \
            --set replicaCount=2

          helm upgrade --install result voting-app-result/charts/result \
            --namespace ${{ env.NAMESPACE }} \
            --set image.full=result:latest \
            --set image.pullPolicy=IfNotPresent \
            --set scaledObject.create=false --set pdb.create=false \
            --set networkPolicy.create=false \
            --set postgresql.host=pg-ci-rw

          helm upgrade --install worker voting-app-worker/charts/worker \
            --namespace ${{ env.NAMESPACE }} \
            --set image.full=worker:latest \
            --set image.pullPolicy=IfNotPresent \
            --set scaledObject.create=false --set pdb.create=false \
            --set postgresql.host=pg-ci-rw \
            --set rabbitmq.host=rabbitmq

      # Step 10: Wait for deployments
      - name: Wait for deployments
        run: |
          kubectl rollout status deployment/vote -n ${{ env.NAMESPACE }} --timeout=120s
          kubectl rollout status deployment/result -n ${{ env.NAMESPACE }} --timeout=120s
          kubectl rollout status deployment/worker -n ${{ env.NAMESPACE }} --timeout=120s

      # Step 11: Create Ingress for local testing
      - name: Create Ingress
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: voting-app-ingress
            namespace: ${{ env.NAMESPACE }}
          spec:
            ingressClassName: nginx
            rules:
              - host: vote.local
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: vote
                          port:
                            number: 5000
              - host: result.local
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: result
                          port:
                            number: 81
          EOF

      # Step 12: Run integration tests
      #
      # Note: the result page is an AngularJS SPA that loads vote data via
      # WebSocket — curl cannot see "1 vote" in the raw HTML (it gets
      # Angular template variables {{aPercent}} instead).
      #
      # Instead, we verify the end-to-end flow by:
      #   1. Check vote frontend serves HTTP
      #   2. Cast a vote via POST
      #   3. Query PostgreSQL directly — if the vote appears, the worker
      #      processed it successfully
      #   4. Check result app is serving (but not checking WebSocket content)
      #
      - name: Run integration tests
        env:
          NAMESPACE: ${{ env.NAMESPACE }}
        run: |
          set -euo pipefail

          # ── PHASE 1: Vote frontend ─────────────────────
          kubectl port-forward -n "$NAMESPACE" svc/vote 5080:5000 &
          VOTE_PF=$!
          kubectl port-forward -n "$NAMESPACE" svc/result 5081:81 &
          RESULT_PF=$!
          sleep 3

          echo "=== PHASE 1: Check vote serves HTTP ==="
          if ! timeout 10 bash -c 'while ! curl -sS -o /dev/null http://localhost:5080 2>/dev/null; do sleep 1; done'; then
            echo "FAIL: vote not serving"
            exit 1
          fi
          echo "PASS: vote is serving"

          # ── PHASE 2: Cast vote ─────────────────────────
          echo "=== PHASE 2: Cast vote (POST vote=b) ==="
          if ! curl -sS -X POST --data "vote=b" "http://localhost:5080" > /dev/null; then
            echo "FAIL: could not POST vote"
            exit 1
          fi
          echo "PASS: vote cast"

          # ── PHASE 3: Verify worker processed it via DB ─
          echo "=== PHASE 3: Check PostgreSQL for vote ==="
          DB_PASS=$(kubectl get secret -n "$NAMESPACE" pg-ci-app -o jsonpath='{.data.password}' | base64 -d)
          for i in $(seq 1 15); do
            VOTE_COUNT=$(kubectl exec -n "$NAMESPACE" pg-ci-1 -- bash -c \
              "PGPASSWORD='$DB_PASS' psql -U app -d db -t -c \"SELECT COUNT(*) FROM votes WHERE vote='b';\"" 2>/dev/null || echo "0")
            VOTE_COUNT=$(echo "$VOTE_COUNT" | tr -d ' ')
            if [ "${VOTE_COUNT:-0}" -ge 1 ]; then
              echo "PASS: worker processed vote (found $VOTE_COUNT vote(s) in DB)"
              break
            fi
            echo "  Waiting for worker... (attempt $i/15)"
            sleep 2
          done

          if [ "${VOTE_COUNT:-0}" -lt 1 ]; then
            echo "FAIL: vote not found in DB after 30s"
            echo "--- Worker logs ---"
            kubectl logs -n "$NAMESPACE" -l app.kubernetes.io/name=worker --tail=20 2>/dev/null || true
            kill $VOTE_PF $RESULT_PF 2>/dev/null || true
            exit 1
          fi

          # ── PHASE 4: Check result page is serving ──────
          echo "=== PHASE 4: Check result page serves HTTP ==="
          if ! timeout 5 bash -c 'while ! curl -sS -o /dev/null http://localhost:5081 2>/dev/null; do sleep 1; done'; then
            echo "FAIL: result not serving"
            kill $VOTE_PF $RESULT_PF 2>/dev/null || true
            exit 1
          fi
          echo "PASS: result is serving"

          # ── DONE ──────────────────────────────────────
          kill $VOTE_PF $RESULT_PF 2>/dev/null || true
          echo ""
          echo "=========================================="
          echo "  ALL TESTS PASSED"
          echo "=========================================="

      # Step 13: Cleanup on failure — dump logs
      - name: Dump logs on failure
        if: failure()
        run: |
          echo "=== Pods ==="
          kubectl get pods -n ${{ env.NAMESPACE }} -o wide
          echo "=== Events ==="
          kubectl get events -n ${{ env.NAMESPACE }} --sort-by='.lastTimestamp' | tail -20
          echo "=== Vote logs ==="
          kubectl logs -n ${{ env.NAMESPACE }} -l app.kubernetes.io/name=vote --tail=30
          echo "=== Result logs ==="
          kubectl logs -n ${{ env.NAMESPACE }} -l app.kubernetes.io/name=result --tail=30
          echo "=== Worker logs ==="
          kubectl logs -n ${{ env.NAMESPACE }} -l app.kubernetes.io/name=worker --tail=30
