prometheus:
  prometheusSpec:
    resources:
      requests:
        memory: 512Mi
        cpu: 300m
      limits:
        memory: 1Gi
        cpu: 500m
    storageSpec:
      disableMountSubPath: true
      volumeClaimTemplate:
        spec:
          storageClassName: gp2
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
grafana:
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m
  persistence:
    enabled: false

  # OIDC auth via Keycloak
  env:
    GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
    GF_AUTH_GENERIC_OAUTH_NAME: "Keycloak"
    GF_AUTH_GENERIC_OAUTH_CLIENT_ID: "grafana"
    GF_AUTH_GENERIC_OAUTH_SCOPES: "openid profile email"
    GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
    GF_AUTH_GENERIC_OAUTH_AUTH_URL: "https://keycloak.mochthebest.pp.ua/realms/myapp/protocol/openid-connect/auth"
    GF_AUTH_GENERIC_OAUTH_TOKEN_URL: "http://keycloak.keycloak.svc.cluster.local:8080/realms/myapp/protocol/openid-connect/token"
    GF_AUTH_GENERIC_OAUTH_API_URL: "http://keycloak.keycloak.svc.cluster.local:8080/realms/myapp/protocol/openid-connect/userinfo"
    # TLS_SKIP_VERIFY — required because token/API URLs use in-cluster HTTP
    # (keycloak.keycloak.svc.cluster.local:8080, not HTTPS).
    # TODO: remove once Keycloak in-cluster HTTPS is set up.
    GF_AUTH_GENERIC_OAUTH_TLS_SKIP_VERIFY_INSECURE: "true"
    GF_SERVER_ROOT_URL: "https://grafana.mochthebest.pp.ua"
    # ── Role mapping ──
    GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(roles[*], 'grafana-admin') && 'Admin' || contains(roles[*], 'grafana-editor') && 'Editor' || 'Viewer'"
    GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: "true"
    GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: "true"
    # ── Logout ──
    GF_AUTH_SIGNOUT_REDIRECT_URL: "https://keycloak.mochthebest.pp.ua/realms/myapp/protocol/openid-connect/logout?redirect_uri=https%3A%2F%2Fgrafana.mochthebest.pp.ua%2Flogin"
  envValueFrom:
    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
      secretKeyRef:
        name: grafana-oidc-secret
        key: client-secret
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki.loki.svc.cluster.local:3100
      access: proxy
    - name: Tempo
      type: tempo
      url: http://tempo.tempo.svc.cluster.local:3200
      access: proxy
      jsonData:
        httpMethod: GET
        tracesToLogs:
          datasourceUid: loki
          tags: ['instance', 'pod', 'namespace']
alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        memory: 256Mi
        cpu: 50m
      limits:
        memory: 512Mi
        cpu: 200m
    storageSpec:
      disableMountSubPath: true
